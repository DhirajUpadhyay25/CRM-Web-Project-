spring.application.name=EduTake

# Active profile (override with SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================
# Local Secrets
# =============================================
# Real credentials live in application-secrets.properties in the project root, which is
# git-ignored. The file is optional so that a deployment can supply the same values through
# environment variables instead (SPRING_DATASOURCE_PASSWORD, APP_RAZORPAY_KEY_SECRET, ...).
#
# Three properties are declared ONLY in that file and are deliberately absent from this one:
#   spring.datasource.password
#   app.razorpay.key-id
#   app.razorpay.key-secret
# Declaring them here as well would make startup depend on whether imported config outranks
# the importing document. Leaving them out removes the question: the secrets file or the
# environment is the single source, and a missing value fails loudly at startup instead of
# falling back to a credential that was previously committed to this repository.
spring.config.import=optional:file:./application-secrets.properties

# =============================================
# Database Configuration
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CrmData}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# File Upload Configuration
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =============================================
# Razorpay Configuration
# =============================================
# app.razorpay.key-id and app.razorpay.key-secret are set in application-secrets.properties
# (or the environment) - see the note at the top of this file. The key id is not itself a
# secret (the browser receives it), but it is kept alongside the secret so that rotating the
# key pair cannot leave a stale id paired with a new secret.

# =============================================
# Test Data Seeding
# =============================================
# When true, DataSeederService.seedAll() runs on every application start. Off by default:
# the seeder writes courses, enrollments, orders and certificates, so it must never run
# against a database whose contents matter.
app.seed.on-startup=false

# Password given to the seeded admin account. Leave blank to skip creating it entirely.
# An account is only created if admin@edutake.com does not already exist.
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
