spring.application.name=EduTake

# Active profile (override with SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =============================================
# Local Secrets
# =============================================
# Real credentials live in application-secrets.properties in the project root, which is
# git-ignored. The file is optional so that a deployment can supply the same values through
# environment variables instead (SPRING_DATASOURCE_PASSWORD, APP_RAZORPAY_KEY_SECRET, ...).
#
# Three properties are declared ONLY in that file and are deliberately absent from this one:
#   spring.datasource.password
#   app.razorpay.key-id
#   app.razorpay.key-secret
# Declaring them here as well would make startup depend on whether imported config outranks
# the importing document. Leaving them out removes the question: the secrets file or the
# environment is the single source, and a missing value fails loudly at startup instead of
# falling back to a credential that was previously committed to this repository.
spring.config.import=optional:file:./application-secrets.properties

# Server Port (honors Render/Heroku/Cloud assigned dynamic PORT)
server.port=${PORT:8080}

# =============================================
# Database Configuration
# =============================================
# Supports standard DATABASE_URL / DB_URL and credentials across local & cloud providers
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:mysql://localhost:3306/CrmData}}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# File Upload Configuration
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:upload/}

# =============================================
# Razorpay Configuration
# =============================================
# Falls back to safe demo placeholders if not set in environment or application-secrets.properties
app.razorpay.key-id=${APP_RAZORPAY_KEY_ID:${RAZORPAY_KEY_ID:rzp_test_placeholder}}
app.razorpay.key-secret=${APP_RAZORPAY_KEY_SECRET:${RAZORPAY_KEY_SECRET:rzp_secret_placeholder}}

# =============================================
# Test Data Seeding & Initial Admin
# =============================================
# When true, DataSeederService.seedAll() runs on application start in dev profile.
app.seed.on-startup=false

# Password given to the seeded admin account. Leave blank to skip creating it.
# An account is created if admin@edutake.com does not already exist.
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
