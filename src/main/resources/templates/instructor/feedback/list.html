<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{instructor/layout/instructor-layout :: layout('My Feedback', ~{::div})}">
<body>
    <div>
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-xs text-gray-500 mb-3 font-medium">
            <a href="/instructor/dashboard" class="hover:text-brand-600 transition-colors">Instructor</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <span class="text-surface-900 font-semibold">Feedback</span>
        </nav>

        <!-- Header -->
        <div class="mb-6 pb-5 border-b border-surface-200">
            <h1 class="text-2xl font-extrabold text-surface-900 tracking-tight">Student Feedback</h1>
            <p class="text-gray-500 text-sm mt-0.5">View and respond to feedback for your courses.</p>
        </div>

        <!-- Alerts -->
        <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 flex items-center gap-3">
            <i class="bi bi-check-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-center gap-3">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${errorMsg}"></span>
        </div>

        <!-- Filters -->
        <div class="bg-white border border-surface-200 rounded-2xl shadow-sm mb-6">
            <form method="get" action="/instructor/feedback" class="p-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <div>
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search feedback..."
                               class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
                    </div>
                    <div>
                        <select name="status" class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
                            <option value="">All Status</option>
                            <option th:each="s : ${feedbackStatuses}" th:value="${s}" th:text="${s.displayName}" th:selected="${status != null and status == s}"></option>
                        </select>
                    </div>
                    <div>
                        <select name="category" class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
                            <option value="">All Categories</option>
                            <option value="Course Content" th:selected="${category == 'Course Content'}">Course Content</option>
                            <option value="Instructor" th:selected="${category == 'Instructor'}">Instructor</option>
                            <option value="Learning Experience" th:selected="${category == 'Learning Experience'}">Learning Experience</option>
                            <option value="Assignments" th:selected="${category == 'Assignments'}">Assignments</option>
                            <option value="General Feedback" th:selected="${category == 'General Feedback'}">General Feedback</option>
                        </select>
                    </div>
                    <div>
                        <select name="sort" class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
                            <option value="newest" th:selected="${sort == 'newest'}">Newest First</option>
                            <option value="oldest" th:selected="${sort == 'oldest'}">Oldest First</option>
                            <option value="rating_high" th:selected="${sort == 'rating_high'}">Highest Rating</option>
                            <option value="rating_low" th:selected="${sort == 'rating_low'}">Lowest Rating</option>
                        </select>
                    </div>
                </div>
                <div class="flex items-center gap-4 mt-3">
                    <div>
                        <select name="courseId" class="px-3 py-1.5 bg-surface-50 border border-surface-200 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
                            <option value="">All Courses</option>
                            <option th:each="c : ${instructorCourses}" th:value="${c.id}" th:text="${c.name}" th:selected="${courseId != null and courseId == c.id}"></option>
                        </select>
                    </div>
                    <button type="submit" class="px-4 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-semibold transition-colors">
                        <i class="bi bi-search"></i> Filter
                    </button>
                    <a href="/instructor/feedback" class="px-4 py-1.5 bg-surface-100 text-surface-700 rounded-lg text-sm font-semibold hover:bg-surface-200 transition-colors">
                        Clear
                    </a>
                </div>
            </form>
        </div>

        <!-- Feedback Table -->
        <div class="bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden">
            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(feedbackPage.content)}" class="p-12 text-center">
                <div class="w-16 h-16 bg-surface-100 rounded-full flex items-center justify-center text-gray-400 text-2xl mx-auto mb-4">
                    <i class="bi bi-chat-quote"></i>
                </div>
                <h3 class="font-semibold text-surface-900 mb-1">No Feedback Available</h3>
                <p class="text-sm text-gray-500">No feedback is available for your courses yet.</p>
            </div>

            <div th:if="${!#lists.isEmpty(feedbackPage.content)}" class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-surface-50 border-b border-surface-200 text-gray-500">
                        <tr>
                            <th class="px-6 py-4 font-semibold">Student</th>
                            <th class="px-6 py-4 font-semibold">Course</th>
                            <th class="px-6 py-4 font-semibold">Rating</th>
                            <th class="px-6 py-4 font-semibold">Category</th>
                            <th class="px-6 py-4 font-semibold">Status</th>
                            <th class="px-6 py-4 font-semibold">Date</th>
                            <th class="px-6 py-4 font-semibold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-surface-200">
                        <tr th:each="fb : ${feedbackPage.content}" class="hover:bg-surface-50 transition-colors">
                            <td class="px-6 py-4">
                                <p class="font-medium text-surface-900 text-xs" th:text="${fb.displayName}"></p>
                            </td>
                            <td class="px-6 py-4 text-gray-500 text-xs" th:text="${fb.course != null ? fb.course.name : 'General'}"></td>
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-0.5">
                                    <template th:each="i : ${#numbers.sequence(1,5)}">
                                        <i th:if="${i <= (fb.rating != null ? fb.rating : 0)}" class="bi bi-star-fill text-amber-400 text-[10px]"></i>
                                        <i th:unless="${i <= (fb.rating != null ? fb.rating : 0)}" class="bi bi-star text-gray-300 text-[10px]"></i>
                                    </template>
                                </div>
                            </td>
                            <td class="px-6 py-4 text-gray-500 text-xs">
                                <span th:if="${fb.category != null}" th:text="${fb.category}" class="px-2 py-0.5 bg-surface-100 rounded-full text-[10px] font-medium"></span>
                            </td>
                            <td class="px-6 py-4">
                                <span th:text="${fb.status != null ? fb.status.displayName : 'New'}"
                                      th:classappend="${fb.status != null ? fb.status.badgeClass : 'bg-blue-100 text-blue-700'}"
                                      class="px-2 py-0.5 rounded-full text-[10px] font-semibold inline-block"></span>
                            </td>
                            <td class="px-6 py-4 text-gray-500 text-xs" th:text="${fb.createdAt != null ? #temporals.format(fb.createdAt, 'dd MMM yyyy') : '-'}"></td>
                            <td class="px-6 py-4 text-right">
                                <a th:href="@{/instructor/feedback/{id}(id=${fb.id})}"
                                   class="inline-flex items-center gap-1 px-3 py-1.5 bg-brand-50 text-brand-600 rounded-lg text-xs font-semibold hover:bg-brand-100 transition-colors">
                                    <i class="bi bi-eye"></i> View
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${feedbackPage.totalPages > 1}" class="px-6 py-4 border-t border-surface-200 flex flex-col sm:flex-row items-center justify-between bg-surface-50 gap-4">
                <div class="text-sm text-gray-500">
                    Showing <span class="font-medium text-surface-900" th:text="${feedbackPage.number * feedbackPage.size + 1}"></span> to
                    <span class="font-medium text-surface-900" th:text="${feedbackPage.isLast() ? feedbackPage.totalElements : (feedbackPage.number + 1) * feedbackPage.size}"></span> of
                    <span class="font-medium text-surface-900" th:text="${feedbackPage.totalElements}"></span> results
                </div>
                <div class="flex items-center gap-2">
                    <a th:if="${feedbackPage.hasPrevious()}"
                       th:href="@{/instructor/feedback(page=${feedbackPage.number - 1}, size=${feedbackPage.size}, keyword=${keyword}, status=${status}, category=${category}, sort=${sort}, courseId=${courseId})}"
                       class="px-3 py-1.5 rounded-lg bg-white border border-surface-200 text-sm font-medium hover:bg-surface-50 text-surface-700 transition-colors">
                        Previous
                    </a>
                    <a th:if="${feedbackPage.hasNext()}"
                       th:href="@{/instructor/feedback(page=${feedbackPage.number + 1}, size=${feedbackPage.size}, keyword=${keyword}, status=${status}, category=${category}, sort=${sort}, courseId=${courseId})}"
                       class="px-3 py-1.5 rounded-lg bg-white border border-surface-200 text-sm font-medium hover:bg-surface-50 text-surface-700 transition-colors">
                        Next
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
