<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{instructor/layout/instructor-layout :: layout('Trainer Profile Settings', ~{::div})}">
<body>
    <div>
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-xs text-gray-500 mb-3 font-medium">
            <a href="/instructor/dashboard" class="hover:text-brand-600 transition-colors">Trainer</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <span class="text-surface-900 font-semibold">Profile Settings</span>
        </nav>

        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-4 border-b border-surface-200">
            <div>
                <h1 class="text-2xl font-bold text-surface-900 tracking-tight">Trainer Profile Settings</h1>
                <p class="text-gray-500 text-xs mt-1">Configure your public bio, name, and specialization details shown on storefront catalog cards.</p>
            </div>
        </div>

        <!-- Success Alert -->
        <div th:if="${successMsg}" class="mb-5 p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-2xl text-xs font-medium flex items-center gap-2 animate-fade-in">
            <i class="bi bi-check-circle-fill text-emerald-600"></i>
            <span th:text="${successMsg}">Success</span>
        </div>

        <!-- Form layout -->
        <div class="max-w-2xl bg-white border border-surface-200 rounded-3xl p-6 md:p-8 shadow-sm">
            <form th:action="@{/instructor/profile}" method="post" class="space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Name -->
                    <div>
                        <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-2">Display Name</label>
                        <input type="text" name="name" th:value="${instructor.name}" required
                               class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm font-semibold">
                    </div>

                    <!-- Email (Disabled) -->
                    <div>
                        <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-2">Email Address</label>
                        <input type="email" th:value="${instructor.email}" disabled
                               class="w-full px-3 py-2 bg-surface-100 border border-surface-200 rounded-xl text-gray-500 text-sm font-mono font-medium">
                    </div>
                </div>

                <!-- Specialization / Expertise -->
                <div>
                    <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-2">Area of Specialization / Expertise</label>
                    <input type="text" name="specialization" th:value="${instructor.specialization}" placeholder="e.g. Senior Java Architect, Machine Learning Specialist"
                           class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm font-medium">
                </div>

                <!-- Bio -->
                <div>
                    <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-2">Profile Bio Description</label>
                    <textarea name="bio" rows="6" th:text="${instructor.bio}" placeholder="Write a short summary about your professional background, certifications, and teaching methodology..."
                              class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm leading-relaxed"></textarea>
                </div>

                <!-- Action Button -->
                <div class="pt-4 border-t border-surface-100 flex justify-end">
                    <button type="submit" class="px-5 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-xs shadow-md shadow-brand-600/10 transition-all flex items-center gap-1.5">
                        <i class="bi bi-save-fill"></i>
                        <span>Save Profile Changes</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
