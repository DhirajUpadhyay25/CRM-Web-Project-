<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{instructor/layout/instructor-layout :: layout('Quiz Questions', ~{::div})}">
<body>
    <div>
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-xs text-gray-500 mb-3 font-medium">
            <a href="/instructor/dashboard" class="hover:text-brand-600 transition-colors">Trainer</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <span class="text-surface-900 font-semibold">Quiz Questions</span>
        </nav>

        <!-- Page Header -->
        <div class="flex items-center gap-3 mb-6 pb-4 border-b border-surface-200">
            <a th:href="@{/instructor/courses/{id}/builder(id=${quiz.courseId})}" class="w-9 h-9 rounded-xl bg-white border border-surface-200 shadow-sm flex items-center justify-center text-gray-500 hover:text-brand-600 hover:bg-surface-100 transition-colors">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-2xl font-bold text-surface-900 tracking-tight" th:text="${quiz.title}">Quiz Title</h1>
                <p class="text-gray-500 text-xs mt-0.5">Manage multiple-choice questions for this quiz assessment.</p>
            </div>
        </div>

        <!-- Success Alert -->
        <div th:if="${successMsg}" class="mb-5 p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-2xl text-xs font-medium flex items-center gap-2 animate-fade-in">
            <i class="bi bi-check-circle-fill text-emerald-600"></i>
            <span th:text="${successMsg}">Success</span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Questions list (Left 2 columns) -->
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white border border-surface-200 rounded-2xl p-6 shadow-sm">
                    <h2 class="text-base font-bold text-surface-900 mb-4 pb-2 border-b border-surface-100 flex items-center gap-2">
                        <i class="bi bi-list-task text-brand-600"></i> Quiz Questions
                    </h2>

                    <!-- Empty state -->
                    <div th:if="${#lists.isEmpty(questions)}" class="p-12 text-center text-gray-400">
                        <i class="bi bi-patch-question text-3xl mb-2"></i>
                        <p class="text-xs">No questions created yet. Use the form on the right to add a question.</p>
                    </div>

                    <!-- Questions loop -->
                    <div th:unless="${#lists.isEmpty(questions)}" class="space-y-6">
                        <div th:each="q, stat : ${questions}" class="p-5 border border-surface-200 rounded-xl bg-surface-50/30 flex flex-col justify-between gap-4 relative group">
                            <!-- Question text -->
                            <div>
                                <div class="flex items-start justify-between gap-4">
                                    <h4 class="font-bold text-surface-900 text-sm leading-relaxed" th:text="${'Q' + (stat.index + 1) + '. ' + q.questionText}">Question</h4>
                                    <!-- Delete Button -->
                                    <form th:action="@{/instructor/quizzes/{quizId}/questions/{id}/delete(quizId=${quiz.id}, id=${q.id})}" method="post" class="inline">
                                        <button type="submit" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-1.5 rounded-lg transition-all text-xs" onclick="return confirm('Are you sure you want to delete this question?')">
                                            <i class="bi bi-trash3-fill"></i>
                                        </button>
                                    </form>
                                </div>

                                <!-- Options List -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4 text-xs font-medium">
                                    <div class="p-2.5 rounded-lg border bg-white flex items-center justify-between"
                                         th:classappend="${q.correctOption == 1} ? 'border-emerald-500 bg-emerald-50/20 text-emerald-800' : 'border-surface-200 text-surface-700'">
                                        <span th:text="${'A) ' + q.optionA}">Option A</span>
                                        <i class="bi bi-check-circle-fill text-emerald-600 text-[10px]" th:if="${q.correctOption == 1}"></i>
                                    </div>
                                    <div class="p-2.5 rounded-lg border bg-white flex items-center justify-between"
                                         th:classappend="${q.correctOption == 2} ? 'border-emerald-500 bg-emerald-50/20 text-emerald-800' : 'border-surface-200 text-surface-700'">
                                        <span th:text="${'B) ' + q.optionB}">Option B</span>
                                        <i class="bi bi-check-circle-fill text-emerald-600 text-[10px]" th:if="${q.correctOption == 2}"></i>
                                    </div>
                                    <div class="p-2.5 rounded-lg border bg-white flex items-center justify-between"
                                         th:classappend="${q.correctOption == 3} ? 'border-emerald-500 bg-emerald-50/20 text-emerald-800' : 'border-surface-200 text-surface-700'">
                                        <span th:text="${'C) ' + q.optionC}">Option C</span>
                                        <i class="bi bi-check-circle-fill text-emerald-600 text-[10px]" th:if="${q.correctOption == 3}"></i>
                                    </div>
                                    <div class="p-2.5 rounded-lg border bg-white flex items-center justify-between"
                                         th:classappend="${q.correctOption == 4} ? 'border-emerald-500 bg-emerald-50/20 text-emerald-800' : 'border-surface-200 text-surface-700'">
                                        <span th:text="${'D) ' + q.optionD}">Option D</span>
                                        <i class="bi bi-check-circle-fill text-emerald-600 text-[10px]" th:if="${q.correctOption == 4}"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Add Question Form (Right 1 column) -->
            <div class="space-y-6">
                <div class="bg-white border border-surface-200 rounded-2xl p-6 shadow-sm">
                    <h3 class="text-sm font-bold text-surface-900 mb-4 pb-2 border-b border-surface-100 flex items-center gap-1.5">
                        <i class="bi bi-plus-circle-fill text-brand-600"></i> Add Question
                    </h3>

                    <form th:action="@{/instructor/quizzes/{quizId}/questions/add(quizId=${quiz.id})}" method="post" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">Question Text</label>
                            <textarea name="questionText" rows="3" required placeholder="Type the question query..."
                                      class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm"></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">Option A</label>
                            <input type="text" name="optionA" required placeholder="Option A text..."
                                   class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">Option B</label>
                            <input type="text" name="optionB" required placeholder="Option B text..."
                                   class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">Option C</label>
                            <input type="text" name="optionC" required placeholder="Option C text..."
                                   class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">Option D</label>
                            <input type="text" name="optionD" required placeholder="Option D text..."
                                   class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">Correct Option (1-4)</label>
                            <select name="correctOption" required
                                    class="w-full px-3.5 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm font-medium transition-all">
                                <option value="1">Option A</option>
                                <option value="2">Option B</option>
                                <option value="3">Option C</option>
                                <option value="4">Option D</option>
                            </select>
                        </div>

                        <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow-md transition-colors flex items-center justify-center gap-1.5">
                            <i class="bi bi-check-lg"></i>
                            <span>Save Question</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
