<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{instructor/layout/instructor-layout :: layout('Add New Course', ~{::div})}">
<body>
    <div>
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-xs text-gray-500 mb-3 font-medium">
            <a href="/instructor/dashboard" class="hover:text-brand-600 transition-colors">Trainer</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <a href="/instructor/courses" class="hover:text-brand-600 transition-colors">Courses</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <span class="text-surface-900 font-semibold">New Course</span>
        </nav>

        <!-- Page Header -->
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-surface-200">
            <div class="flex items-center gap-3">
                <a href="/instructor/courses" class="w-9 h-9 rounded-xl bg-white border border-surface-200 shadow-sm flex items-center justify-center text-gray-500 hover:text-brand-600 hover:bg-surface-100 transition-colors">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-bold text-surface-900 tracking-tight">Create New Course</h1>
                    <p class="text-gray-500 text-xs">Add a new educational program to the catalog as a draft.</p>
                </div>
            </div>
        </div>

        <!-- Form -->
        <form th:action="@{/instructor/courses/new}" method="post" enctype="multipart/form-data" th:object="${courseDTO}">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- Left 2 Columns: Core Content -->
                <div class="lg:col-span-2 space-y-6">
                    
                    <!-- 1. Basic Information Card -->
                    <div class="bg-white border border-surface-200 rounded-2xl p-6 shadow-sm">
                        <div class="flex items-center gap-2 mb-4 pb-3 border-b border-surface-100">
                            <i class="bi bi-info-circle text-brand-600 text-lg"></i>
                            <h2 class="text-base font-bold text-surface-900">Basic Information</h2>
                        </div>
                        
                        <div class="space-y-4">
                            <!-- Course Title -->
                            <div>
                                <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">
                                    Course Title <span class="text-red-500">*</span>
                                </label>
                                <input type="text" th:field="*{name}" required placeholder="e.g. Master Full Stack Java Development"
                                       class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm font-medium transition-all">
                                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-500 text-xs mt-1"></p>
                            </div>

                            <!-- Short Description -->
                            <div>
                                <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">
                                    Short Description (Card Summary) <span class="text-red-500">*</span>
                                </label>
                                <textarea th:field="*{shortDescription}" rows="2" maxlength="500" required placeholder="A concise 1-2 sentence pitch shown on course cards and search previews..."
                                          class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm transition-all"></textarea>
                                <p th:if="${#fields.hasErrors('shortDescription')}" th:errors="*{shortDescription}" class="text-red-500 text-xs mt-1"></p>
                            </div>

                            <!-- Full Description -->
                            <div>
                                <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">
                                    Full Description & Curriculum Details
                                </label>
                                <textarea th:field="*{description}" rows="8" placeholder="Comprehensive course syllabus, what students will master, prerequisites, and learning outcomes..."
                                          class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm font-sans transition-all"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Pricing & Commercials Card -->
                    <div class="bg-white border border-surface-200 rounded-2xl p-6 shadow-sm">
                        <div class="flex items-center gap-2 mb-4 pb-3 border-b border-surface-100">
                            <i class="bi bi-tag text-brand-600 text-lg"></i>
                            <h2 class="text-base font-bold text-surface-900">Pricing &amp; Commercials</h2>
                        </div>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <!-- Original Price -->
                            <div>
                                <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">
                                    Original Price (₹) <span class="text-red-500">*</span>
                                </label>
                                <div class="relative">
                                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 font-bold text-sm">₹</span>
                                    <input type="number" step="0.01" min="0" th:field="*{originalPrice}" required placeholder="0.00"
                                           class="w-full pl-8 pr-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm font-semibold transition-all">
                                </div>
                                <p class="text-[11px] text-gray-400 mt-1">Set to 0 for a 100% Free course.</p>
                                <p th:if="${#fields.hasErrors('originalPrice')}" th:errors="*{originalPrice}" class="text-red-500 text-xs mt-1"></p>
                            </div>

                            <!-- Discounted Price -->
                            <div>
                                <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">
                                    Discounted / Offer Price (₹)
                                </label>
                                <div class="relative">
                                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 font-bold text-sm">₹</span>
                                    <input type="number" step="0.01" min="0" th:field="*{discountedPrice}" placeholder="0.00"
                                           class="w-full pl-8 pr-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm font-semibold transition-all">
                                </div>
                                <p class="text-[11px] text-gray-400 mt-1">Leave blank if no discount is active.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Settings & Metadata -->
                <div class="space-y-6">
                    <!-- 3. Course Metadata Card -->
                    <div class="bg-white border border-surface-200 rounded-2xl p-6 shadow-sm">
                        <div class="flex items-center gap-2 mb-4 pb-3 border-b border-surface-100">
                            <i class="bi bi-gear text-brand-600 text-lg"></i>
                            <h2 class="text-base font-bold text-surface-900">Course Metadata</h2>
                        </div>
                        
                        <div class="space-y-4">
                            <!-- Category -->
                            <div>
                                <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">
                                    Category <span class="text-red-500">*</span>
                                </label>
                                <select th:field="*{categoryId}" required
                                        class="w-full px-3.5 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm font-medium transition-all">
                                    <option value="" disabled selected>Select Category</option>
                                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                </select>
                                <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="text-red-500 text-xs mt-1"></p>
                            </div>

                            <!-- Instructor (Read-only) -->
                            <div>
                                <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">Instructor</label>
                                <input type="text" th:value="${#authentication.name}" disabled
                                       class="w-full px-4 py-2.5 bg-surface-100 border border-surface-200 rounded-xl text-gray-500 text-sm font-medium transition-all">
                            </div>

                            <!-- Level -->
                            <div>
                                <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">
                                    Target Level <span class="text-red-500">*</span>
                                </label>
                                <select th:field="*{level}" required
                                        class="w-full px-3.5 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm font-medium transition-all">
                                    <option th:each="lvl : ${levels}" th:value="${lvl}" th:text="${lvl}"></option>
                                </select>
                            </div>

                            <!-- Language -->
                            <div>
                                <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">Language</label>
                                <input type="text" th:field="*{language}" placeholder="e.g. English, Hindi"
                                       class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm font-medium transition-all">
                            </div>

                            <!-- Duration -->
                            <div>
                                <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">Duration</label>
                                <input type="text" th:field="*{duration}" placeholder="e.g. 12 Hours, 4 Weeks"
                                       class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm font-medium transition-all">
                            </div>
                        </div>
                    </div>

                    <!-- 4. Course Image Card -->
                    <div class="bg-white border border-surface-200 rounded-2xl p-6 shadow-sm">
                        <div class="flex items-center gap-2 mb-4 pb-3 border-b border-surface-100">
                            <i class="bi bi-image text-brand-600 text-lg"></i>
                            <h2 class="text-base font-bold text-surface-900">Course Thumbnail</h2>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5">Upload Image</label>
                            <input type="file" name="courseImg" accept="image/*"
                                   class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 transition-all cursor-pointer">
                        </div>
                    </div>

                    <!-- Submit Actions -->
                    <div class="flex gap-3">
                        <a href="/instructor/courses" class="flex-1 py-3 text-center border border-surface-200 text-surface-700 hover:bg-surface-100 font-bold rounded-xl text-xs transition-all shadow-sm">
                            Cancel
                        </a>
                        <button type="submit" class="flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-xs transition-all shadow-md shadow-brand-600/10 flex items-center justify-center gap-1.5">
                            <i class="bi bi-check-circle-fill"></i>
                            <span>Create Course</span>
                        </button>
                    </div>
                </div>

            </div>
        </form>
    </div>
</body>
</html>
