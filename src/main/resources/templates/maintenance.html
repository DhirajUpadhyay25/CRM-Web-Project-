<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance | EduTake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
                        surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-surface-950 text-white min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Background Decorative Glows -->
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-brand-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="max-w-xl w-full text-center relative z-10">
        
        <!-- Icon / Graphic -->
        <div class="inline-flex items-center justify-center w-24 h-24 rounded-3xl bg-brand-500/10 border border-brand-500/30 text-brand-400 mb-8 shadow-2xl shadow-brand-500/20">
            <i class="bi bi-tools text-4xl animate-bounce"></i>
        </div>

        <!-- Heading -->
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">Under Scheduled Maintenance</h1>
        <p class="text-gray-400 text-base sm:text-lg mb-8" th:text="${maintenanceMessage ?: 'EduTake is currently undergoing scheduled platform upgrades and performance optimization. We will be back online shortly.'}">
            EduTake is currently undergoing scheduled platform upgrades and performance optimization. We will be back online shortly.
        </p>

        <!-- Status Card -->
        <div class="bg-surface-900/80 backdrop-blur-md rounded-2xl p-6 border border-white/10 shadow-xl mb-8 text-left space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-white/5">
                <span class="text-sm text-gray-400 flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span> Service Status
                </span>
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/20">
                    Maintenance Active
                </span>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-sm text-gray-400 flex items-center gap-2">
                    <i class="bi bi-clock-history text-gray-500"></i> Expected Availability
                </span>
                <span class="text-sm font-medium text-white" th:text="${expectedTime ?: 'Shortly'}">Shortly</span>
            </div>
        </div>

        <!-- Admin Bypass CTA -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <a href="/login" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-brand-600 to-brand-700 hover:from-brand-500 hover:to-brand-600 text-white font-medium text-sm transition-all shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2">
                <i class="bi bi-shield-lock-fill"></i> Staff / Admin Sign In
            </a>
            <button onclick="window.location.reload()" class="w-full sm:w-auto px-6 py-3 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 font-medium text-sm transition-all border border-white/10 flex items-center justify-center gap-2">
                <i class="bi bi-arrow-clockwise"></i> Check Status
            </button>
        </div>

        <p class="mt-8 text-xs text-gray-600">
            &copy; 2026 EduTake LMS. All rights reserved.
        </p>
    </div>

</body>
</html>
