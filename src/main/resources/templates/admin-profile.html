<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/css/style.css" />
    
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
    
</head>

<body>

    <div th:replace="~{fragments/admin-sidebar :: frg-admin-sidebar}"></div>

   <div class="content">

    <!-- Dashboard Header -->
    <div class="dashboard-header">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h2 class="fw-bold mb-1">
                    <i class="bi bi-speedometer2"></i>
                    Admin Dashboard
                </h2>
                <p class="text-muted mb-0">
                    Monitor course sales, customer growth and business performance.
                </p>
            </div>

            <div>
                <button class="btn btn-primary">
                    <i class="bi bi-download"></i>
                    Export Report
                </button>
            </div>
        </div>
    </div>

    <!-- Statistics Cards -->
    <div class="row g-4 mb-5">

        <div class="col-md-6 col-xl-3">
            <div class="stats-card bg-sales">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6>Total Sales</h6>
                        <h3>₹2,00,000</h3>
                    </div>
                    <i class="bi bi-currency-rupee fs-1"></i>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-xl-3">
            <div class="stats-card bg-course">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6>Courses Sold</h6>
                        <h3>30</h3>
                    </div>
                    <i class="bi bi-book-fill fs-1"></i>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-xl-3">
            <div class="stats-card bg-users">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6>Customers</h6>
                        <h3>200+</h3>
                    </div>
                    <i class="bi bi-people-fill fs-1"></i>
                </div>
            </div>
        </div>

        <div class="col-md-6 col-xl-3">
            <div class="stats-card bg-feedback">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6>Feedback Rate</h6>
                        <h3>94%</h3>
                    </div>
                    <i class="bi bi-chat-left-dots-fill fs-1"></i>
                </div>
            </div>
        </div>

    </div>

    <!-- Charts Row -->
    <div class="row g-4">

        <!-- Sales Graph -->
        <div class="col-lg-6">
            <div class="chart-card p-4 h-100">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="chart-title mb-0">
                        Today's Course Sales
                    </h5>

                    <span class="badge bg-success">
                        Live
                    </span>
                </div>
                  <h1> 5 </h1>
                <div id="myPlot"></div>

            </div>
        </div>

        <!-- Pie Chart -->
        <div class="col-lg-6">
            <div class="chart-card p-4 h-100">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="chart-title mb-0">
                        Course Distribution
                    </h5>

                    <span class="badge bg-primary">
                        Overall
                    </span>
                </div>
                <h2>30</h2>

                <canvas id="myPieChart"></canvas>

            </div>
        </div>

    </div>

    <!-- Full Width Graph -->
    <div class="row mt-4">

        <div class="col-12">

            <div class="chart-card p-4">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h5 class="chart-title mb-0">
                        Weekly Course Performance
                    </h5>

                    <span class="badge bg-warning text-dark">
                        Last 7 Days
                    </span>

                </div>

                <canvas id="myChart"></canvas>

            </div>

        </div>

    </div>

</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
        
  
        
</body>
</html>
