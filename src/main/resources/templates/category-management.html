<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base-head :: head('Category Management | Admin')}"></head>

<body class="bg-surface-950 text-white antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <div th:replace="~{fragments/tw-navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col mt-16 pt-8 pb-24">
        <div class="container mx-auto px-4 max-w-6xl">
            
            <!-- Header -->
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight mb-2">Categories</h1>
                    <p class="text-gray-400">Manage course categories and groupings.</p>
                </div>
                <a href="/courseManagement" class="text-brand-400 hover:text-brand-300 font-medium flex items-center gap-2">
                    <i class="bi bi-arrow-left"></i> Back to Courses
                </a>
            </div>

            <!-- Alerts -->
            <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-500/10 border border-green-500/20 text-green-400 flex items-center gap-3">
                <i class="bi bi-check-circle-fill"></i>
                <span th:text="${successMsg}"></span>
            </div>
            <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 flex items-center gap-3">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${errorMsg}"></span>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Add Category Form -->
                <div class="lg:col-span-1">
                    <div class="bg-surface-900 border border-white/10 rounded-2xl p-6 shadow-xl sticky top-24">
                        <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                            <i class="bi bi-plus-circle text-brand-400"></i> New Category
                        </h2>
                        
                        <form th:action="@{/addCategory}" method="post" th:object="${categoryDTO}" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1.5">Category Name *</label>
                                <input type="text" th:field="*{name}" required
                                       class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500">
                                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-400 text-xs mt-1"></p>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-gray-400 mb-1.5">Description (Optional)</label>
                                <textarea th:field="*{description}" rows="3"
                                          class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500"></textarea>
                            </div>
                            
                            <div class="flex items-center gap-3 py-2">
                                <input type="checkbox" th:field="*{active}" id="active" class="w-5 h-5 rounded border-white/10 bg-surface-950 text-brand-500 focus:ring-brand-500/50">
                                <label for="active" class="text-sm font-medium text-gray-300">Active (Visible)</label>
                            </div>
                            
                            <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl transition-all shadow-lg shadow-brand-600/20">
                                Create Category
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Categories List -->
                <div class="lg:col-span-2">
                    <div class="bg-surface-900 border border-white/10 rounded-2xl overflow-hidden shadow-xl">
                        
                        <div th:if="${#lists.isEmpty(categories)}" class="p-12 text-center">
                            <i class="bi bi-folder-x text-4xl text-gray-600 mb-3 block"></i>
                            <h3 class="text-lg font-bold text-white mb-1">No Categories</h3>
                            <p class="text-gray-400 text-sm">Create your first category using the form.</p>
                        </div>

                        <div th:unless="${#lists.isEmpty(categories)}" class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-surface-800/50 border-b border-white/5">
                                        <th class="py-4 px-6 text-xs font-semibold text-gray-400 uppercase tracking-wider">Name</th>
                                        <th class="py-4 px-6 text-xs font-semibold text-gray-400 uppercase tracking-wider">Slug</th>
                                        <th class="py-4 px-6 text-xs font-semibold text-gray-400 uppercase tracking-wider text-center">Status</th>
                                        <th class="py-4 px-6 text-xs font-semibold text-gray-400 uppercase tracking-wider text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-white/5">
                                    <tr th:each="cat : ${categories}" class="hover:bg-white/5 transition-colors">
                                        <td class="py-4 px-6">
                                            <div class="font-medium text-white" th:text="${cat.name}"></div>
                                            <div class="text-xs text-gray-500 truncate max-w-xs mt-1" th:text="${cat.description}"></div>
                                        </td>
                                        <td class="py-4 px-6 text-sm text-gray-400 font-mono" th:text="${cat.slug}"></td>
                                        <td class="py-4 px-6 text-center">
                                            <span th:if="${cat.active}" class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-green-500/10 text-green-400 border border-green-500/20">Active</span>
                                            <span th:unless="${cat.active}" class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-gray-500/10 text-gray-400 border border-gray-500/20">Inactive</span>
                                        </td>
                                        <td class="py-4 px-6 text-right">
                                            <button class="text-gray-400 hover:text-brand-400 transition-colors p-2" title="Edit coming soon">
                                                <i class="bi bi-pencil-square"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/tw-footer :: footer}"></div>

</body>
</html>
