<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base-head :: head('Edit Course | Admin')}"></head>

<body class="bg-surface-950 text-white antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <div th:replace="~{fragments/tw-navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col mt-16 pt-8 pb-24 relative overflow-hidden">
        <div class="container mx-auto px-4 max-w-5xl relative z-10">
            
            <!-- Header -->
            <div class="flex items-center gap-4 mb-8">
                <a href="/courseManagement" class="w-10 h-10 rounded-xl bg-surface-900 border border-white/10 flex items-center justify-center text-gray-400 hover:text-white hover:bg-surface-800 transition-colors">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-3xl font-bold tracking-tight mb-1">Edit Course</h1>
                    <p class="text-gray-400">Update course details and metadata.</p>
                </div>
            </div>

            <!-- Alerts -->
            <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 flex items-center gap-3">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${errorMsg}"></span>
            </div>

            <form th:action="@{/updateCourseDetailsForm}" method="post" enctype="multipart/form-data" th:object="${courseDTO}">
                
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{imageUrl}">

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    
                    <!-- Left Column: Main Content -->
                    <div class="lg:col-span-2 space-y-6">
                        
                        <!-- Basic Info Section -->
                        <div class="bg-surface-900 border border-white/10 rounded-2xl p-6 shadow-xl">
                            <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                                <i class="bi bi-info-circle text-brand-400"></i> Basic Information
                            </h2>
                            
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Course Title *</label>
                                    <input type="text" th:field="*{name}" required
                                           class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-red-400 text-xs mt-1"></p>
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Short Description</label>
                                    <textarea th:field="*{shortDescription}" rows="2" maxlength="500" placeholder="A brief summary for course cards..."
                                              class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50"></textarea>
                                    <p th:if="${#fields.hasErrors('shortDescription')}" th:errors="*{shortDescription}" class="text-red-400 text-xs mt-1"></p>
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Full Description</label>
                                    <textarea th:field="*{description}" rows="6"
                                              class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50 font-mono text-sm"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Pricing Section -->
                        <div class="bg-surface-900 border border-white/10 rounded-2xl p-6 shadow-xl">
                            <h2 class="text-lg font-bold mb-6 flex items-center gap-2">
                                <i class="bi bi-tag text-brand-400"></i> Pricing
                            </h2>
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Regular Price (₹) *</label>
                                    <input type="number" step="0.01" min="0" th:field="*{originalPrice}" required
                                           class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                                    <p th:if="${#fields.hasErrors('originalPrice')}" th:errors="*{originalPrice}" class="text-red-400 text-xs mt-1"></p>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Discounted Price (₹)</label>
                                    <input type="number" step="0.01" min="0" th:field="*{discountedPrice}" placeholder="Leave blank if no discount"
                                           class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                                    <p th:if="${#fields.hasErrors('discountedPrice')}" th:errors="*{discountedPrice}" class="text-red-400 text-xs mt-1"></p>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Right Column: Settings & Meta -->
                    <div class="lg:col-span-1 space-y-6">
                        
                        <!-- Publishing Status -->
                        <div class="bg-surface-900 border border-white/10 rounded-2xl p-6 shadow-xl">
                            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                                <i class="bi bi-eye text-brand-400"></i> Publishing
                            </h2>
                            
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Status *</label>
                                    <select th:field="*{status}" class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50 appearance-none">
                                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                                    </select>
                                </div>
                                
                                <div class="flex items-center gap-3 p-3 bg-surface-950/30 border border-white/5 rounded-xl">
                                    <input type="checkbox" th:field="*{featured}" id="featured" class="w-5 h-5 rounded border-white/10 bg-surface-950 text-brand-500 focus:ring-brand-500/50">
                                    <label for="featured" class="text-sm font-medium text-gray-300">Feature on homepage</label>
                                </div>
                            </div>
                        </div>

                        <!-- Organization -->
                        <div class="bg-surface-900 border border-white/10 rounded-2xl p-6 shadow-xl">
                            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                                <i class="bi bi-diagram-2 text-brand-400"></i> Organization
                            </h2>
                            
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Category *</label>
                                    <select th:field="*{categoryId}" required class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50 appearance-none">
                                        <option value="">Select Category...</option>
                                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                                    </select>
                                    <p th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}" class="text-red-400 text-xs mt-1"></p>
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Level *</label>
                                    <select th:field="*{level}" class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50 appearance-none">
                                        <option th:each="lvl : ${levels}" th:value="${lvl}" th:text="${lvl}"></option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Language</label>
                                    <input type="text" th:field="*{language}" placeholder="e.g. English, Hindi"
                                           class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Duration</label>
                                    <input type="text" th:field="*{duration}" placeholder="e.g. 4 Weeks, 30 Hours"
                                           class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-400 mb-1.5">Instructor Name</label>
                                    <input type="text" th:field="*{instructor}"
                                           class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                                </div>
                            </div>
                        </div>

                        <!-- Media -->
                        <div class="bg-surface-900 border border-white/10 rounded-2xl p-6 shadow-xl">
                            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                                <i class="bi bi-image text-brand-400"></i> Course Image
                            </h2>
                            
                            <div th:if="${courseDTO.imageUrl}" class="mb-4">
                                <img th:src="@{${courseDTO.imageUrl}}" class="w-full h-32 object-cover rounded-xl border border-white/10">
                            </div>

                            <div>
                                <input type="file" name="courseImg" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-brand-500/10 file:text-brand-400 hover:file:bg-brand-500/20 cursor-pointer">
                                <p class="text-xs text-gray-500 mt-2">Leave blank to keep existing image.</p>
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="pt-4 sticky bottom-8">
                            <button type="submit" class="w-full py-4 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl transition-all shadow-xl shadow-brand-600/20 flex items-center justify-center gap-2 text-lg">
                                <i class="bi bi-check2"></i> Save Changes
                            </button>
                        </div>
                        
                    </div>
                </div>
            </form>
            
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/tw-footer :: footer}"></div>

</body>
</html>
