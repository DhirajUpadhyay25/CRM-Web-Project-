<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{student/layout/student-layout :: layout('Settings', ~{::div})}">
<body>
    <div>
        
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-xs text-gray-500 mb-3 font-medium">
            <a href="/student/dashboard" class="hover:text-brand-600 transition-colors">Student</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <span class="text-surface-900 font-semibold">Settings</span>
        </nav>

        <!-- Page Header -->
        <div class="mb-6 pb-5 border-b border-surface-200">
            <h1 class="text-2xl font-extrabold text-surface-900 tracking-tight">Settings</h1>
            <p class="text-gray-500 text-sm mt-0.5">Manage your account settings and preferences.</p>
        </div>

        <div class="max-w-2xl space-y-6">
            
            <!-- Change Password -->
            <div class="bg-white rounded-2xl border border-surface-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-surface-100 bg-surface-50">
                    <h3 class="font-semibold text-sm text-surface-900 flex items-center gap-2">
                        <i class="bi bi-shield-lock text-gray-400"></i> Change Password
                    </h3>
                </div>
                <form th:action="@{/student/settings/change-password}" method="post" class="p-6 space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1.5">Current Password</label>
                        <input type="password" name="currentPassword" required
                               class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1.5">New Password</label>
                        <input type="password" name="newPassword" required minlength="6"
                               class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1.5">Confirm New Password</label>
                        <input type="password" name="confirmPassword" required minlength="6"
                               class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold shadow-sm transition-all">
                            <i class="bi bi-check-lg mr-1"></i> Update Password
                        </button>
                    </div>
                </form>
            </div>

            <!-- Account Info -->
            <div class="bg-white rounded-2xl border border-surface-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-surface-100 bg-surface-50">
                    <h3 class="font-semibold text-sm text-surface-900 flex items-center gap-2">
                        <i class="bi bi-info-circle text-gray-400"></i> Account Information
                    </h3>
                </div>
                <div class="p-6 space-y-3">
                    <div class="flex items-center justify-between py-2 border-b border-surface-100">
                        <span class="text-sm text-gray-500">Email</span>
                        <span class="text-sm font-medium text-surface-900" th:text="${studentEmail}">email@example.com</span>
                    </div>
                    <div class="flex items-center justify-between py-2 border-b border-surface-100">
                        <span class="text-sm text-gray-500">Role</span>
                        <span class="text-sm font-medium text-surface-900">Student</span>
                    </div>
                    <div class="flex items-center justify-between py-2">
                        <span class="text-sm text-gray-500">Account Status</span>
                        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-green-50 text-green-600">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-500 mr-1"></span> Active
                        </span>
                    </div>
                </div>
            </div>

            <!-- Danger Zone -->
            <div class="bg-white rounded-2xl border border-red-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-red-100 bg-red-50">
                    <h3 class="font-semibold text-sm text-red-700 flex items-center gap-2">
                        <i class="bi bi-exclamation-triangle"></i> Danger Zone
                    </h3>
                </div>
                <div class="p-6">
                    <p class="text-sm text-gray-500 mb-4">If you want to delete your account, please contact support. This action is irreversible.</p>
                    <a href="mailto:support@edutake.com" class="inline-flex items-center gap-2 px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-semibold transition-colors border border-red-200">
                        <i class="bi bi-envelope"></i> Contact Support
                    </a>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
