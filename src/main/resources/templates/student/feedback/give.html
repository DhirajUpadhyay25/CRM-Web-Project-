<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{student/layout/student-layout :: layout('Give Feedback', ~{::div})}">
<body>
    <div>
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-xs text-gray-500 mb-3 font-medium">
            <a href="/student/dashboard" class="hover:text-brand-600 transition-colors">Student</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <a href="/student/feedback" class="hover:text-brand-600 transition-colors">Feedback</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <span class="text-surface-900 font-semibold">Give Feedback</span>
        </nav>

        <!-- Page Header -->
        <div class="mb-6 pb-5 border-b border-surface-200">
            <h1 class="text-2xl font-extrabold text-surface-900 tracking-tight">Give Feedback</h1>
            <p class="text-gray-500 text-sm mt-0.5">Share your experience and help us improve.</p>
        </div>

        <!-- Alerts -->
        <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 flex items-center gap-3">
            <i class="bi bi-check-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-center gap-3">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${errorMsg}"></span>
        </div>

        <!-- Feedback Form -->
        <div class="bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden max-w-2xl">
            <form th:action="@{/student/feedback/submit}" method="post" id="feedbackForm">
                <div class="p-6 space-y-5">

                    <!-- Course Selection -->
                    <div>
                        <label for="courseId" class="block text-sm font-semibold text-surface-800 mb-1.5">Course <span class="text-red-500">*</span></label>
                        <select id="courseId" name="courseId" required
                                class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                            <option value="">Select a course...</option>
                            <option th:each="enrollment : ${eligibleCourses}"
                                    th:value="${enrollment.course.id}"
                                    th:text="${enrollment.course.name}"
                                    th:selected="${selectedCourseId != null and selectedCourseId == enrollment.course.id}"></option>
                        </select>
                    </div>

                    <!-- Rating -->
                    <div>
                        <label class="block text-sm font-semibold text-surface-800 mb-1.5">Rating <span class="text-red-500">*</span></label>
                        <div class="flex items-center gap-1" id="ratingContainer">
                            <button type="button" th:each="i : ${#numbers.sequence(1,5)}" th:data-value="${i}"
                                    class="rating-star text-2xl text-gray-300 hover:text-amber-400 transition-colors focus:outline-none"
                                    onclick="setRating(this.getAttribute('data-value'))">
                                <i class="bi bi-star-fill"></i>
                            </button>
                            <input type="hidden" id="ratingInput" name="rating" value="">
                            <span class="ml-2 text-sm text-gray-500" id="ratingText">Select a rating</span>
                        </div>
                    </div>

                    <!-- Category -->
                    <div>
                        <label for="category" class="block text-sm font-semibold text-surface-800 mb-1.5">Category</label>
                        <select id="category" name="category"
                                class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                            <option value="">Select a category...</option>
                            <option value="Course Content">Course Content</option>
                            <option value="Instructor">Instructor</option>
                            <option value="Course Difficulty">Course Difficulty</option>
                            <option value="Learning Experience">Learning Experience</option>
                            <option value="Assignments">Assignments</option>
                            <option value="Assessments">Assessments</option>
                            <option value="Live Classes">Live Classes</option>
                            <option value="Learning Materials">Learning Materials</option>
                            <option value="Platform Experience">Platform Experience</option>
                            <option value="Technical Issue">Technical Issue</option>
                            <option value="General Feedback">General Feedback</option>
                        </select>
                    </div>

                    <!-- Subject -->
                    <div>
                        <label for="subject" class="block text-sm font-semibold text-surface-800 mb-1.5">Subject</label>
                        <input type="text" id="subject" name="subject" maxlength="255"
                               placeholder="Brief subject for your feedback..."
                               class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                    </div>

                    <!-- Message -->
                    <div>
                        <label for="message" class="block text-sm font-semibold text-surface-800 mb-1.5">Message <span class="text-red-500">*</span></label>
                        <textarea id="message" name="message" rows="5" required minlength="10" maxlength="2000"
                                  placeholder="Share your detailed feedback..."
                                  class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all resize-none"></textarea>
                        <p class="text-xs text-gray-400 mt-1">Minimum 10 characters. <span id="charCount">0</span>/2000</p>
                    </div>

                    <!-- Options -->
                    <div class="flex flex-col sm:flex-row gap-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" name="isAnonymous" value="true" class="w-4 h-4 rounded border-surface-300 text-brand-600 focus:ring-brand-500">
                            <span class="text-sm text-gray-600">Submit anonymously</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" name="isPublic" value="true" class="w-4 h-4 rounded border-surface-300 text-brand-600 focus:ring-brand-500">
                            <span class="text-sm text-gray-600">Allow public display</span>
                        </label>
                    </div>
                </div>

                <!-- Actions -->
                <div class="px-6 py-4 border-t border-surface-200 bg-surface-50 flex items-center justify-between">
                    <a href="/student/feedback" class="px-4 py-2 bg-white border border-surface-300 rounded-xl text-gray-700 font-medium hover:bg-surface-50 transition-colors text-sm">
                        Cancel
                    </a>
                    <button type="submit" id="submitBtn"
                            class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-semibold text-sm shadow-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                        <span id="submitText">Submit Feedback</span>
                        <span id="submitSpinner" class="hidden">
                            <i class="bi bi-arrow-repeat animate-spin"></i> Submitting...
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        function setRating(value) {
            document.getElementById('ratingInput').value = value;
            var stars = document.querySelectorAll('.rating-star');
            stars.forEach(function(star, index) {
                if (index < value) {
                    star.classList.remove('text-gray-300');
                    star.classList.add('text-amber-400');
                } else {
                    star.classList.remove('text-amber-400');
                    star.classList.add('text-gray-300');
                }
            });
            var texts = ['', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];
            document.getElementById('ratingText').textContent = texts[value] || '';
        }

        document.getElementById('message').addEventListener('input', function() {
            document.getElementById('charCount').textContent = this.value.length;
        });

        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            var rating = document.getElementById('ratingInput').value;
            if (!rating) {
                e.preventDefault();
                alert('Please select a rating.');
                return;
            }
            document.getElementById('submitText').classList.add('hidden');
            document.getElementById('submitSpinner').classList.remove('hidden');
            document.getElementById('submitBtn').disabled = true;
        });
    </script>
</body>
</html>
