<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{student/layout/student-layout :: layout('Feedback Details', ~{::div})}">
<body>
    <div>
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-xs text-gray-500 mb-3 font-medium">
            <a href="/student/dashboard" class="hover:text-brand-600 transition-colors">Student</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <a href="/student/feedback" class="hover:text-brand-600 transition-colors">Feedback</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <span class="text-surface-900 font-semibold">Details</span>
        </nav>

        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-5 border-b border-surface-200">
            <div>
                <h1 class="text-2xl font-extrabold text-surface-900 tracking-tight">Feedback #<span th:text="${feedback.id}"></span></h1>
                <p class="text-gray-500 text-sm mt-0.5">Submitted on <span th:text="${feedback.createdAt != null ? #temporals.format(feedback.createdAt, 'dd MMMM yyyy \'at\' HH:mm') : '-'}"></span></p>
            </div>
            <div class="flex items-center gap-2">
                <a th:if="${feedback.status != null and feedback.status.isEditable()}"
                   th:href="@{/student/feedback/{id}/edit(id=${feedback.id})}"
                   class="inline-flex items-center gap-1.5 px-4 py-2 bg-surface-100 text-surface-700 rounded-xl text-sm font-semibold hover:bg-surface-200 transition-colors">
                    <i class="bi bi-pencil"></i> Edit
                </a>
                <a href="/student/feedback" class="inline-flex items-center gap-1.5 px-4 py-2 bg-white border border-surface-300 rounded-xl text-sm font-semibold text-gray-700 hover:bg-surface-50 transition-colors">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 flex items-center gap-3">
            <i class="bi bi-check-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-center gap-3">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${errorMsg}"></span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Main Content -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Feedback Card -->
                <div class="bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-surface-200 bg-surface-50">
                        <h2 class="font-bold text-surface-900">Feedback Details</h2>
                    </div>
                    <div class="p-6 space-y-4">
                        <!-- Course & Instructor -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Course</p>
                                <p class="text-surface-900 font-medium" th:text="${feedback.course != null ? feedback.course.name : 'General'}"></p>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Instructor</p>
                                <p class="text-surface-900 font-medium" th:text="${feedback.instructor != null ? feedback.instructor.name : 'N/A'}"></p>
                            </div>
                        </div>

                        <!-- Rating -->
                        <div>
                            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Rating</p>
                            <div class="flex items-center gap-1">
                                <template th:each="i : ${#numbers.sequence(1,5)}">
                                    <i th:if="${i <= (feedback.rating != null ? feedback.rating : 0)}" class="bi bi-star-fill text-amber-400 text-lg"></i>
                                    <i th:unless="${i <= (feedback.rating != null ? feedback.rating : 0)}" class="bi bi-star text-gray-300 text-lg"></i>
                                </template>
                                <span class="text-sm text-gray-500 ml-2" th:text="'(' + ${feedback.rating} + '/5)'"></span>
                            </div>
                        </div>

                        <!-- Category & Subject -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Category</p>
                                <span th:if="${feedback.category != null}" th:text="${feedback.category}"
                                      class="px-2.5 py-1 bg-surface-100 rounded-full text-xs font-semibold text-surface-700 inline-block"></span>
                                <span th:unless="${feedback.category != null}" class="text-gray-400 text-sm">-</span>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Subject</p>
                                <p class="text-surface-900 font-medium text-sm" th:text="${feedback.subject != null ? feedback.subject : '-'}"></p>
                            </div>
                        </div>

                        <!-- Message -->
                        <div>
                            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Message</p>
                            <div class="bg-surface-50 p-4 rounded-xl border border-surface-200 text-surface-900 text-sm whitespace-pre-wrap" th:text="${feedback.message}"></div>
                        </div>

                        <!-- Privacy -->
                        <div class="flex items-center gap-4 text-xs text-gray-500">
                            <span th:if="${feedback.anonymous}" class="flex items-center gap-1">
                                <i class="bi bi-eye-slash"></i> Anonymous
                            </span>
                            <span th:if="${feedback.public}" class="flex items-center gap-1">
                                <i class="bi bi-globe"></i> Public
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Responses -->
                <div th:if="${responses != null and !responses.isEmpty()}" class="bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-surface-200 bg-surface-50">
                        <h2 class="font-bold text-surface-900">Responses</h2>
                    </div>
                    <div class="p-6 space-y-4">
                        <div th:each="resp : ${responses}" class="border-l-4 border-brand-500 pl-4 py-2">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-semibold text-sm text-surface-900" th:text="${resp.responderName != null ? resp.responderName : resp.responderEmail}"></span>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold"
                                      th:classappend="${resp.responderRole == 'ADMIN' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}"
                                      th:text="${resp.responderRole}"></span>
                                <span class="text-xs text-gray-400" th:text="${resp.createdAt != null ? #temporals.format(resp.createdAt, 'dd MMM yyyy, HH:mm') : ''}"></span>
                            </div>
                            <p class="text-sm text-surface-800 whitespace-pre-wrap" th:text="${resp.message}"></p>
                        </div>
                    </div>
                </div>

                <!-- No responses yet -->
                <div th:if="${responses == null or responses.isEmpty()}" class="bg-white border border-surface-200 rounded-2xl shadow-sm p-6 text-center">
                    <p class="text-sm text-gray-500">
                        <i class="bi bi-hourglass text-lg mr-1"></i>
                        No responses yet. Our team will review your feedback shortly.
                    </p>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="space-y-6">
                <!-- Status -->
                <div class="bg-white border border-surface-200 rounded-2xl shadow-sm p-6">
                    <h3 class="font-bold text-surface-900 mb-4">Status</h3>
                    <span th:text="${feedback.status != null ? feedback.status.displayName : 'New'}"
                          th:classappend="${feedback.status != null ? feedback.status.badgeClass : 'bg-blue-100 text-blue-700'}"
                          class="px-3 py-1.5 rounded-full text-sm font-bold inline-block"></span>

                    <div class="mt-4 space-y-3 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-500">Submitted</span>
                            <span class="text-surface-800 font-medium" th:text="${feedback.createdAt != null ? #temporals.format(feedback.createdAt, 'dd MMM yyyy') : '-'}"></span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Last Updated</span>
                            <span class="text-surface-800 font-medium" th:text="${feedback.updatedAt != null ? #temporals.format(feedback.updatedAt, 'dd MMM yyyy') : '-'}"></span>
                        </div>
                        <div th:if="${feedback.resolvedAt != null}" class="flex justify-between">
                            <span class="text-gray-500">Resolved</span>
                            <span class="text-surface-800 font-medium" th:text="${#temporals.format(feedback.resolvedAt, 'dd MMM yyyy')}"></span>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="bg-white border border-surface-200 rounded-2xl shadow-sm p-6">
                    <h3 class="font-bold text-surface-900 mb-4">Actions</h3>
                    <div class="space-y-2">
                        <a th:if="${feedback.status != null and feedback.status.isEditable()}"
                           th:href="@{/student/feedback/{id}/edit(id=${feedback.id})}"
                           class="w-full flex items-center gap-2 px-4 py-2.5 bg-surface-100 text-surface-700 rounded-xl text-sm font-semibold hover:bg-surface-200 transition-colors">
                            <i class="bi bi-pencil"></i> Edit Feedback
                        </a>
                        <form th:if="${feedback.status != null and feedback.status.isEditable()}"
                              th:action="@{/student/feedback/{id}/delete(id=${feedback.id})}" method="post"
                              onsubmit="return confirm('Are you sure you want to withdraw this feedback?');">
                            <button type="submit"
                                    class="w-full flex items-center gap-2 px-4 py-2.5 bg-red-50 text-red-600 rounded-xl text-sm font-semibold hover:bg-red-100 transition-colors">
                                <i class="bi bi-trash3"></i> Withdraw Feedback
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
