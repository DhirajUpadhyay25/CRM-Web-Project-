<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{student/layout/student-layout :: layout('Edit Feedback', ~{::div})}">
<body>
    <div>
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-xs text-gray-500 mb-3 font-medium">
            <a href="/student/dashboard" class="hover:text-brand-600 transition-colors">Student</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <a href="/student/feedback" class="hover:text-brand-600 transition-colors">Feedback</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <span class="text-surface-900 font-semibold">Edit</span>
        </nav>

        <!-- Page Header -->
        <div class="mb-6 pb-5 border-b border-surface-200">
            <h1 class="text-2xl font-extrabold text-surface-900 tracking-tight">Edit Feedback</h1>
            <p class="text-gray-500 text-sm mt-0.5">Update your feedback for <span th:text="${feedback.course != null ? feedback.course.name : 'this course'}" class="font-semibold"></span></p>
        </div>

        <!-- Alerts -->
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-center gap-3">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${errorMsg}"></span>
        </div>

        <!-- Edit Form -->
        <div class="bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden max-w-2xl">
            <form th:action="@{/student/feedback/{id}/edit(id=${feedback.id})}" method="post" id="editForm">
                <div class="p-6 space-y-5">

                    <!-- Rating -->
                    <div>
                        <label class="block text-sm font-semibold text-surface-800 mb-1.5">Rating <span class="text-red-500">*</span></label>
                        <div class="flex items-center gap-1" id="ratingContainer">
                            <button type="button" th:each="i : ${#numbers.sequence(1,5)}" th:data-value="${i}"
                                    class="rating-star text-2xl transition-colors focus:outline-none"
                                    th:classappend="${i <= (feedback.rating != null ? feedback.rating : 0) ? 'text-amber-400' : 'text-gray-300'}"
                                    onclick="setRating(this.getAttribute('data-value'))">
                                <i class="bi bi-star-fill"></i>
                            </button>
                            <input type="hidden" id="ratingInput" name="rating" th:value="${feedback.rating}">
                            <span class="ml-2 text-sm text-gray-500" id="ratingText"
                                  th:text="${feedback.rating != null ? (feedback.rating == 1 ? 'Poor' : feedback.rating == 2 ? 'Fair' : feedback.rating == 3 ? 'Good' : feedback.rating == 4 ? 'Very Good' : 'Excellent') : 'Select a rating'}"></span>
                        </div>
                    </div>

                    <!-- Category -->
                    <div>
                        <label for="category" class="block text-sm font-semibold text-surface-800 mb-1.5">Category</label>
                        <select id="category" name="category"
                                class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                            <option value="">Select a category...</option>
                            <option value="Course Content" th:selected="${feedback.category == 'Course Content'}">Course Content</option>
                            <option value="Instructor" th:selected="${feedback.category == 'Instructor'}">Instructor</option>
                            <option value="Course Difficulty" th:selected="${feedback.category == 'Course Difficulty'}">Course Difficulty</option>
                            <option value="Learning Experience" th:selected="${feedback.category == 'Learning Experience'}">Learning Experience</option>
                            <option value="Assignments" th:selected="${feedback.category == 'Assignments'}">Assignments</option>
                            <option value="Assessments" th:selected="${feedback.category == 'Assessments'}">Assessments</option>
                            <option value="Live Classes" th:selected="${feedback.category == 'Live Classes'}">Live Classes</option>
                            <option value="Learning Materials" th:selected="${feedback.category == 'Learning Materials'}">Learning Materials</option>
                            <option value="Platform Experience" th:selected="${feedback.category == 'Platform Experience'}">Platform Experience</option>
                            <option value="Technical Issue" th:selected="${feedback.category == 'Technical Issue'}">Technical Issue</option>
                            <option value="General Feedback" th:selected="${feedback.category == 'General Feedback'}">General Feedback</option>
                        </select>
                    </div>

                    <!-- Subject -->
                    <div>
                        <label for="subject" class="block text-sm font-semibold text-surface-800 mb-1.5">Subject</label>
                        <input type="text" id="subject" name="subject" maxlength="255"
                               th:value="${feedback.subject}"
                               class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                    </div>

                    <!-- Message -->
                    <div>
                        <label for="message" class="block text-sm font-semibold text-surface-800 mb-1.5">Message <span class="text-red-500">*</span></label>
                        <textarea id="message" name="message" rows="5" required minlength="10" maxlength="2000"
                                  class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all resize-none"
                                  th:text="${feedback.message}"></textarea>
                        <p class="text-xs text-gray-400 mt-1">Minimum 10 characters. <span id="charCount" th:text="${feedback.message != null ? feedback.message.length() : 0}">0</span>/2000</p>
                    </div>
                </div>

                <!-- Actions -->
                <div class="px-6 py-4 border-t border-surface-200 bg-surface-50 flex items-center justify-between">
                    <a th:href="@{/student/feedback/{id}(id=${feedback.id})}"
                       class="px-4 py-2 bg-white border border-surface-300 rounded-xl text-gray-700 font-medium hover:bg-surface-50 transition-colors text-sm">
                        Cancel
                    </a>
                    <button type="submit" id="submitBtn"
                            class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-semibold text-sm shadow-sm transition-all">
                        <span id="submitText">Save Changes</span>
                        <span id="submitSpinner" class="hidden">
                            <i class="bi bi-arrow-repeat animate-spin"></i> Saving...
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        function setRating(value) {
            document.getElementById('ratingInput').value = value;
            var stars = document.querySelectorAll('.rating-star');
            stars.forEach(function(star, index) {
                if (index < value) {
                    star.classList.remove('text-gray-300');
                    star.classList.add('text-amber-400');
                } else {
                    star.classList.remove('text-amber-400');
                    star.classList.add('text-gray-300');
                }
            });
            var texts = ['', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];
            document.getElementById('ratingText').textContent = texts[value] || '';
        }

        document.getElementById('message').addEventListener('input', function() {
            document.getElementById('charCount').textContent = this.value.length;
        });

        document.getElementById('editForm').addEventListener('submit', function(e) {
            var rating = document.getElementById('ratingInput').value;
            if (!rating) {
                e.preventDefault();
                alert('Please select a rating.');
                return;
            }
            document.getElementById('submitText').classList.add('hidden');
            document.getElementById('submitSpinner').classList.remove('hidden');
            document.getElementById('submitBtn').disabled = true;
        });
    </script>
</body>
</html>
