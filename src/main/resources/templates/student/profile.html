<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{student/layout/student-layout :: layout('My Profile', ~{::div})}">
<body>
    <div>
        
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-xs text-gray-500 mb-3 font-medium">
            <a href="/student/dashboard" class="hover:text-brand-600 transition-colors">Student</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <span class="text-surface-900 font-semibold">Profile</span>
        </nav>

        <!-- Page Header -->
        <div class="mb-6 pb-5 border-b border-surface-200">
            <h1 class="text-2xl font-extrabold text-surface-900 tracking-tight">My Profile</h1>
            <p class="text-gray-500 text-sm mt-0.5">Manage your personal information.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Profile Card -->
            <div class="bg-white rounded-2xl border border-surface-200 shadow-sm overflow-hidden">
                <div class="h-24 bg-gradient-to-r from-brand-500 to-brand-700"></div>
                <div class="px-6 pb-6 -mt-12 text-center">
                    <div class="w-24 h-24 rounded-full bg-white border-4 border-white shadow-lg mx-auto mb-3 overflow-hidden">
                        <img th:if="${studentImage}" th:src="@{${studentImage}}" class="w-full h-full object-cover" alt="Avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                        <div th:unless="${studentImage}" class="w-full h-full bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white text-3xl font-bold">
                            <span th:text="${studentName != null ? studentName.substring(0,1).toUpperCase() : 'S'}">S</span>
                        </div>
                    </div>
                    <h2 class="text-lg font-bold text-surface-900" th:text="${studentName}">Student Name</h2>
                    <p class="text-sm text-gray-500" th:text="${studentEmail}">email@example.com</p>
                    <div class="mt-4 flex justify-center gap-3">
                        <a href="/student/settings" class="px-4 py-2 bg-surface-100 hover:bg-surface-200 text-surface-700 rounded-xl text-xs font-semibold transition-colors">
                            <i class="bi bi-gear mr-1"></i> Settings
                        </a>
                    </div>
                </div>
            </div>

            <!-- Profile Form -->
            <div class="lg:col-span-2 bg-white rounded-2xl border border-surface-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-surface-100 bg-surface-50">
                    <h3 class="font-semibold text-sm text-surface-900">Personal Information</h3>
                </div>
                <form th:action="@{/student/profile/update}" method="post" enctype="multipart/form-data" class="p-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        
                        <!-- Name -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Full Name</label>
                            <input type="text" name="name" th:value="${user.name}" 
                                   class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                        </div>

                        <!-- Email (Read-only) -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Email Address</label>
                            <input type="email" th:value="${user.email}" readonly
                                   class="w-full px-4 py-2.5 bg-surface-100 border border-surface-200 rounded-xl text-sm text-gray-500 cursor-not-allowed">
                        </div>

                        <!-- Phone -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Phone Number</label>
                            <input type="text" name="phoneno" th:value="${user.phoneno}" 
                                   class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                        </div>

                        <!-- City -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">City</label>
                            <input type="text" name="city" th:value="${user.city}" 
                                   class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all">
                        </div>

                        <!-- Profile Picture -->
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-gray-600 mb-1.5">Profile Picture</label>
                            <input type="file" name="image" accept="image/*"
                                   class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-50 file:text-brand-600 hover:file:bg-brand-100">
                        </div>
                    </div>

                    <div class="mt-6 flex justify-end">
                        <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold shadow-sm transition-all">
                            <i class="bi bi-check-lg mr-1"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</body>
</html>
