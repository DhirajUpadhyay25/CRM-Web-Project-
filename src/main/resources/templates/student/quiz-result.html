<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{student/layout/student-layout :: layout('Quiz Results', ~{::div})}">
<body>
    <div>

        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-xs text-gray-500 mb-4 font-medium">
            <a href="/student/dashboard" class="hover:text-brand-600 transition-colors">Student</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <a href="/student/courses" class="hover:text-brand-600 transition-colors">My Courses</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <a th:href="@{/student/courses/{cId}/player(cId=${courseId})}" class="hover:text-brand-600 transition-colors">Player</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <span class="text-surface-900 font-semibold truncate max-w-[200px]" th:text="${quiz.title}">Quiz</span>
        </nav>

        <!-- Quiz scorecard card -->
        <div class="bg-white rounded-3xl border border-surface-200 shadow-sm p-6 text-center max-w-2xl mx-auto mb-8">
            <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl mx-auto mb-4"
                 th:classappend="${attempt.passed} ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'">
                <i class="bi" th:classappend="${attempt.passed} ? 'bi-check-circle-fill' : 'bi-x-circle-fill'"></i>
            </div>
            
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider"
                  th:classappend="${attempt.passed} ? 'bg-green-50 text-green-600 border border-green-200' : 'bg-red-50 text-red-600 border border-red-200'"
                  th:text="${attempt.passed ? 'PASSED' : 'FAILED'}">PASSED</span>

            <h1 class="text-2xl font-black text-surface-900 mt-2 tracking-tight" th:text="${quiz.title}">Quiz Title</h1>
            <p class="text-gray-500 text-xs mt-1" th:text="${attempt.passed ? 'Congratulations, you have passed this assessment!' : 'You did not achieve the required passing score. Please try again.'}"></p>

            <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto my-6 p-4 bg-surface-50 border border-surface-150 rounded-2xl">
                <div>
                    <p class="text-[10px] text-gray-400 font-semibold uppercase">Your Score</p>
                    <p class="text-xl font-black text-surface-900 mt-0.5" th:text="${attempt.score + '%'}">0%</p>
                </div>
                <div>
                    <p class="text-[10px] text-gray-400 font-semibold uppercase">Required Score</p>
                    <p class="text-xl font-black text-gray-500 mt-0.5" th:text="${quiz.passingScore + '%'}">70%</p>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row justify-center gap-3">
                <a th:if="${!attempt.passed}" th:href="@{/student/courses/{cId}/quizzes/{qId}(cId=${courseId}, qId=${quiz.id})}"
                   class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-xs shadow transition-all">
                    Retry Assessment
                </a>
                <a th:href="@{/student/courses/{cId}/player(cId=${courseId})}"
                   class="px-5 py-2.5 bg-surface-900 hover:bg-surface-800 text-white font-bold rounded-xl text-xs shadow transition-all">
                    Back to Course Player
                </a>
            </div>
        </div>

        <!-- Question Review list -->
        <div class="max-w-2xl mx-auto space-y-6">
            <h2 class="font-bold text-sm text-surface-900 flex items-center gap-1.5"><i class="bi bi-card-checklist text-brand-500"></i> Review Answers</h2>

            <div th:each="q, iterStat : ${questions}" class="bg-white rounded-2xl border border-surface-200 shadow-sm p-6">
                <div class="flex gap-3 mb-4">
                    <span class="w-6 h-6 rounded-lg bg-surface-100 text-gray-500 font-extrabold text-xs flex items-center justify-center flex-shrink-0" th:text="${iterStat.count}">1</span>
                    <h3 class="font-bold text-xs text-surface-900 leading-snug" th:text="${q.questionText}">Question text?</h3>
                </div>

                <!-- Review list options -->
                <div class="space-y-2.5 ml-9">
                    <!-- Option A -->
                    <div class="p-3 rounded-xl border text-xs flex justify-between items-center"
                         th:classappend="${q.correctOption == 1} ? 'bg-green-50 border-green-200 text-green-800 font-semibold' : (${studentAnswers.get(q.id) == 1} ? 'bg-red-50 border-red-200 text-red-800 font-semibold' : 'bg-transparent border-surface-200 text-gray-600')">
                        <span th:text="${q.optionA}">Option A</span>
                        <span th:if="${q.correctOption == 1}" class="text-[10px] text-green-600 font-bold flex items-center gap-0.5"><i class="bi bi-check-circle-fill"></i> Correct</span>
                        <span th:if="${studentAnswers.get(q.id) == 1 && q.correctOption != 1}" class="text-[10px] text-red-600 font-bold flex items-center gap-0.5"><i class="bi bi-x-circle-fill"></i> Your Answer</span>
                    </div>

                    <!-- Option B -->
                    <div class="p-3 rounded-xl border text-xs flex justify-between items-center"
                         th:classappend="${q.correctOption == 2} ? 'bg-green-50 border-green-200 text-green-800 font-semibold' : (${studentAnswers.get(q.id) == 2} ? 'bg-red-50 border-red-200 text-red-800 font-semibold' : 'bg-transparent border-surface-200 text-gray-600')">
                        <span th:text="${q.optionB}">Option B</span>
                        <span th:if="${q.correctOption == 2}" class="text-[10px] text-green-600 font-bold flex items-center gap-0.5"><i class="bi bi-check-circle-fill"></i> Correct</span>
                        <span th:if="${studentAnswers.get(q.id) == 2 && q.correctOption != 2}" class="text-[10px] text-red-600 font-bold flex items-center gap-0.5"><i class="bi bi-x-circle-fill"></i> Your Answer</span>
                    </div>

                    <!-- Option C -->
                    <div class="p-3 rounded-xl border text-xs flex justify-between items-center"
                         th:classappend="${q.correctOption == 3} ? 'bg-green-50 border-green-200 text-green-800 font-semibold' : (${studentAnswers.get(q.id) == 3} ? 'bg-red-50 border-red-200 text-red-800 font-semibold' : 'bg-transparent border-surface-200 text-gray-600')">
                        <span th:text="${q.optionC}">Option C</span>
                        <span th:if="${q.correctOption == 3}" class="text-[10px] text-green-600 font-bold flex items-center gap-0.5"><i class="bi bi-check-circle-fill"></i> Correct</span>
                        <span th:if="${studentAnswers.get(q.id) == 3 && q.correctOption != 3}" class="text-[10px] text-red-600 font-bold flex items-center gap-0.5"><i class="bi bi-x-circle-fill"></i> Your Answer</span>
                    </div>

                    <!-- Option D -->
                    <div class="p-3 rounded-xl border text-xs flex justify-between items-center"
                         th:classappend="${q.correctOption == 4} ? 'bg-green-50 border-green-200 text-green-800 font-semibold' : (${studentAnswers.get(q.id) == 4} ? 'bg-red-50 border-red-200 text-red-800 font-semibold' : 'bg-transparent border-surface-200 text-gray-600')">
                        <span th:text="${q.optionD}">Option D</span>
                        <span th:if="${q.correctOption == 4}" class="text-[10px] text-green-600 font-bold flex items-center gap-0.5"><i class="bi bi-check-circle-fill"></i> Correct</span>
                        <span th:if="${studentAnswers.get(q.id) == 4 && q.correctOption != 4}" class="text-[10px] text-red-600 font-bold flex items-center gap-0.5"><i class="bi bi-x-circle-fill"></i> Your Answer</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
