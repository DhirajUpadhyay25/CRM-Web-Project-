<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title + ' | EduTake Student'}">EduTake Student</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81', 950: '#1e1b4b' },
                        surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
        .sidebar-section-items { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .sidebar-section-items.expanded { max-height: 500px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-down { animation: slideDown 0.15s ease-out; }
    </style>
</head>
<body class="bg-surface-50 text-surface-900 antialiased flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="bg-surface-950 text-white w-64 flex-shrink-0 flex flex-col h-full transition-transform duration-300 transform -translate-x-full md:translate-x-0 fixed md:relative z-30">
        <!-- Logo -->
        <div class="h-16 flex items-center px-5 border-b border-white/10 shrink-0">
            <a href="/student/dashboard" class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center font-bold text-lg shadow-lg shadow-brand-500/20">E</div>
                <span class="font-bold text-xl tracking-tight">EduTake<span class="text-brand-400">.</span></span>
            </a>
        </div>
        
        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto py-3 px-3 space-y-0.5 custom-scrollbar">
            <div th:replace="~{fragments/student-sidebar :: frg-student-sidebar}"></div>
        </nav>
        
        <!-- Bottom User Area -->
        <div class="p-4 border-t border-white/10 shrink-0">
            <div class="flex items-center gap-3 mb-3">
                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center font-bold text-sm shadow-lg shadow-brand-500/20 overflow-hidden">
                    <img th:if="${studentImage}" th:src="@{${studentImage}}" class="w-full h-full object-cover" alt="Avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                    <span th:unless="${studentImage}" class="flex items-center justify-center w-full h-full" th:text="${studentName != null ? studentName.substring(0,1).toUpperCase() : 'S'}">S</span>
                </div>
                <div class="min-w-0">
                    <p class="text-sm font-semibold text-white truncate" th:text="${studentName != null ? studentName : 'Student'}">Student</p>
                    <p class="text-xs text-gray-500 truncate">Student Portal</p>
                </div>
            </div>
            <div class="flex gap-2">
                <a href="/student/profile" class="flex-1 flex items-center justify-center gap-1.5 py-1.5 bg-white/5 text-gray-400 rounded-lg hover:bg-white/10 hover:text-white transition-colors text-xs font-medium">
                    <i class="bi bi-person text-sm"></i> Profile
                </a>
                <a href="/logout" class="flex-1 flex items-center justify-center gap-1.5 py-1.5 bg-red-500/10 text-red-400 rounded-lg hover:bg-red-500/20 transition-colors text-xs font-medium">
                    <i class="bi bi-box-arrow-right text-sm"></i> Logout
                </a>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT WRAPPER -->
    <div class="flex-1 flex flex-col h-full overflow-hidden bg-surface-50">
        
        <!-- NAVBAR -->
        <header class="h-14 bg-white border-b border-surface-200 flex items-center justify-between px-4 lg:px-6 z-20 shadow-sm shrink-0">
            <div class="flex items-center gap-3 flex-1 min-w-0">
                <button id="sidebarToggle" class="md:hidden text-gray-500 hover:text-brand-600 transition-colors text-xl flex-shrink-0">
                    <i class="bi bi-list"></i>
                </button>
                
                <div class="hidden sm:flex items-center text-sm text-gray-500 gap-1.5 min-w-0">
                    <a href="/student/dashboard" class="text-gray-400 hover:text-brand-600 transition-colors"><i class="bi bi-house-fill"></i></a>
                    <i class="bi bi-chevron-right text-[10px] text-gray-300"></i>
                    <span id="breadcrumbText" class="font-medium text-surface-800 truncate">Dashboard</span>
                </div>
            </div>
            
            <div class="flex items-center gap-2 lg:gap-3 flex-shrink-0">
                <!-- Current Time -->
                <div class="hidden lg:flex flex-col items-end text-right">
                    <span id="navTime" class="text-xs font-semibold text-surface-800 tabular-nums">--:--</span>
                    <span id="navDate" class="text-[10px] text-gray-400">---</span>
                </div>
                
                <!-- Notifications -->
                <div class="relative" id="notifContainer">
                    <button id="notifBtn" class="relative w-9 h-9 rounded-full bg-surface-100 flex items-center justify-center text-gray-500 hover:text-brand-600 hover:bg-brand-50 transition-colors" onclick="toggleNotifications()">
                        <i class="bi bi-bell"></i>
                        <span id="notifBadge" class="hidden absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center px-1 border-2 border-white">0</span>
                    </button>
                    
                    <div id="notifDropdown" class="hidden absolute right-0 top-full mt-2 w-80 sm:w-96 bg-white rounded-xl shadow-xl border border-surface-200 overflow-hidden z-50 animate-slide-down">
                        <div class="px-4 py-3 border-b border-surface-100 flex items-center justify-between bg-surface-50">
                            <h3 class="font-semibold text-sm text-surface-900">Notifications</h3>
                            <button onclick="markAllNotificationsRead()" class="text-xs text-brand-600 hover:text-brand-700 font-medium">Mark all as read</button>
                        </div>
                        <div id="notifList" class="max-h-80 overflow-y-auto">
                            <div class="p-6 text-center text-gray-400 text-sm">
                                <i class="bi bi-bell-slash text-2xl mb-2 block"></i>
                                No notifications
                            </div>
                        </div>
                        <div class="px-4 py-2.5 border-t border-surface-100 bg-surface-50 text-center">
                            <a href="/student/notifications" class="text-xs text-brand-600 hover:text-brand-700 font-semibold">View all notifications</a>
                        </div>
                    </div>
                </div>
                
                <!-- Profile Dropdown -->
                <div class="relative" id="profileContainer">
                    <button onclick="toggleProfileMenu()" class="flex items-center gap-2 hover:bg-surface-100 rounded-xl px-2 py-1.5 transition-colors">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-bold text-xs shadow-sm overflow-hidden">
                            <img th:if="${studentImage}" th:src="@{'/uploads/' + ${studentImage}}" class="w-full h-full object-cover" alt="Avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
                            <span th:unless="${studentImage}" class="flex items-center justify-center w-full h-full" th:text="${studentName != null ? studentName.substring(0,1).toUpperCase() : 'S'}">S</span>
                        </div>
                        <span class="hidden lg:block text-sm font-medium text-surface-800 max-w-[100px] truncate" th:text="${studentName != null ? studentName : 'Student'}">Student</span>
                        <i class="hidden lg:block bi bi-chevron-down text-[10px] text-gray-400"></i>
                    </button>
                    
                    <div id="profileDropdown" class="hidden absolute right-0 top-full mt-2 w-56 bg-white rounded-xl shadow-xl border border-surface-200 overflow-hidden z-50 animate-slide-down">
                        <div class="px-4 py-3 border-b border-surface-100 bg-surface-50">
                            <p class="text-sm font-semibold text-surface-900 truncate" th:text="${studentName != null ? studentName : 'Student'}">Student</p>
                            <p class="text-xs text-gray-500 truncate" th:text="${studentEmail}">email@example.com</p>
                        </div>
                        <div class="py-1">
                            <a href="/student/profile" class="flex items-center gap-3 px-4 py-2.5 text-sm text-surface-700 hover:bg-surface-50 transition-colors">
                                <i class="bi bi-person text-gray-400"></i> My Profile
                            </a>
                            <a href="/student/settings" class="flex items-center gap-3 px-4 py-2.5 text-sm text-surface-700 hover:bg-surface-50 transition-colors">
                                <i class="bi bi-gear text-gray-400"></i> Settings
                            </a>
                            <a href="/student/courses" class="flex items-center gap-3 px-4 py-2.5 text-sm text-surface-700 hover:bg-surface-50 transition-colors">
                                <i class="bi bi-play-btn text-gray-400"></i> My Courses
                            </a>
                        </div>
                        <div class="border-t border-surface-100 py-1">
                            <a href="/logout" class="flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition-colors">
                                <i class="bi bi-box-arrow-right"></i> Sign Out
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN SCROLLING CONTENT -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <!-- Flash Messages -->
            <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 flex items-start gap-3 shadow-sm animate-fade-in">
                <i class="bi bi-check-circle-fill text-green-500 mt-0.5"></i>
                <p class="font-medium text-sm" th:text="${successMsg}"></p>
            </div>
            <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-start gap-3 shadow-sm animate-fade-in">
                <i class="bi bi-exclamation-triangle-fill text-red-500 mt-0.5"></i>
                <p class="font-medium text-sm" th:text="${errorMsg}"></p>
            </div>
            
            <div th:replace="${content}"></div>
        </main>
        
        <div id="sidebarOverlay" class="fixed inset-0 bg-surface-900/50 backdrop-blur-sm z-20 hidden md:hidden"></div>
    </div>

    <script>
        // SIDEBAR TOGGLE
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
        }

        sidebarToggle.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        // ACTIVE LINK HIGHLIGHTING
        const currentPath = window.location.pathname;
        const links = document.querySelectorAll('.sidebar-link');
        const breadcrumbText = document.getElementById('breadcrumbText');

        links.forEach(link => {
            const path = link.getAttribute('data-path');
            if (path && (currentPath === path || (currentPath.startsWith(path) && path !== '/student/dashboard'))) {
                link.classList.add('bg-brand-600/20', 'text-brand-400');
                link.classList.remove('text-gray-300');
                const label = link.querySelector('span');
                if (label && breadcrumbText) {
                    breadcrumbText.textContent = label.textContent;
                }
            }
        });

        // LIVE CLOCK
        function updateClock() {
            const now = new Date();
            const timeEl = document.getElementById('navTime');
            const dateEl = document.getElementById('navDate');
            if (timeEl) timeEl.textContent = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
            if (dateEl) dateEl.textContent = now.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        updateClock();
        setInterval(updateClock, 30000);

        // PROFILE DROPDOWN
        let profileOpen = false;
        function toggleProfileMenu() {
            const dropdown = document.getElementById('profileDropdown');
            profileOpen = !profileOpen;
            dropdown.classList.toggle('hidden', !profileOpen);
        }

        // NOTIFICATIONS
        let notifOpen = false;
        function toggleNotifications() {
            const dropdown = document.getElementById('notifDropdown');
            notifOpen = !notifOpen;
            dropdown.classList.toggle('hidden', !notifOpen);
            if (notifOpen) loadNotifications();
        }

        document.addEventListener('click', (e) => {
            const notifContainer = document.getElementById('notifContainer');
            const profileContainer = document.getElementById('profileContainer');
            if (notifOpen && notifContainer && !notifContainer.contains(e.target)) {
                document.getElementById('notifDropdown').classList.add('hidden');
                notifOpen = false;
            }
            if (profileOpen && profileContainer && !profileContainer.contains(e.target)) {
                document.getElementById('profileDropdown').classList.add('hidden');
                profileOpen = false;
            }
        });

        function loadNotifications() {
            fetch('/student/api/notifications/recent')
                .then(r => r.json())
                .then(notifications => {
                    const list = document.getElementById('notifList');
                    if (!notifications || notifications.length === 0) {
                        list.innerHTML = '<div class="p-6 text-center text-gray-400 text-sm"><i class="bi bi-bell-slash text-2xl mb-2 block"></i>No notifications yet</div>';
                        return;
                    }
                    list.innerHTML = notifications.map(n => {
                        const icon = getNotifIcon(n.type);
                        const timeAgo = getTimeAgo(n.createdAt);
                        const readClass = n.read ? 'bg-white' : 'bg-brand-50/50';
                        return '<a href="' + (n.targetUrl || '#') + '" onclick="markNotifRead(' + n.id + ')" class="block px-4 py-3 hover:bg-surface-50 transition-colors border-b border-surface-100 last:border-0 ' + readClass + '">' +
                            '<div class="flex items-start gap-3">' +
                            '<div class="w-8 h-8 rounded-full ' + icon.bg + ' flex items-center justify-center flex-shrink-0 mt-0.5">' +
                            '<i class="bi ' + icon.icon + ' ' + icon.color + ' text-sm"></i></div>' +
                            '<div class="min-w-0 flex-1">' +
                            '<p class="text-sm font-medium text-surface-900 truncate">' + n.title + '</p>' +
                            '<p class="text-xs text-gray-500 mt-0.5 line-clamp-1">' + (n.message || '') + '</p>' +
                            '<p class="text-[10px] text-gray-400 mt-1">' + timeAgo + '</p></div>' +
                            (!n.read ? '<div class="w-2 h-2 rounded-full bg-brand-500 flex-shrink-0 mt-2"></div>' : '') +
                            '</div></a>';
                    }).join('');
                })
                .catch(() => {});
        }

        function getNotifIcon(type) {
            const icons = {
                'COURSE_ENROLLED': { icon: 'bi-mortarboard-fill', bg: 'bg-blue-50', color: 'text-blue-500' },
                'ORDER_PLACED': { icon: 'bi-bag-check-fill', bg: 'bg-green-50', color: 'text-green-500' },
                'PAYMENT_SUCCESS': { icon: 'bi-currency-rupee', bg: 'bg-emerald-50', color: 'text-emerald-500' },
                'COURSE_UPDATE': { icon: 'bi-info-circle-fill', bg: 'bg-cyan-50', color: 'text-cyan-500' },
                'NEW_LESSON': { icon: 'bi-play-circle-fill', bg: 'bg-purple-50', color: 'text-purple-500' },
                'CERTIFICATE_READY': { icon: 'bi-award-fill', bg: 'bg-yellow-50', color: 'text-yellow-500' },
                'SYSTEM': { icon: 'bi-bell-fill', bg: 'bg-gray-50', color: 'text-gray-500' }
            };
            return icons[type] || { icon: 'bi-bell-fill', bg: 'bg-gray-50', color: 'text-gray-500' };
        }

        function getTimeAgo(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + ' min ago';
            if (diff < 86400) return Math.floor(diff / 3600) + ' hr ago';
            if (diff < 604800) return Math.floor(diff / 86400) + ' day(s) ago';
            return date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }

        function markNotifRead(id) {
            fetch('/student/api/notifications/' + id + '/read', { method: 'POST' }).catch(() => {});
        }

        function markAllNotificationsRead() {
            fetch('/student/api/notifications/mark-all-read', { method: 'POST' })
                .then(() => { loadNotifications(); updateNotifBadge(); }).catch(() => {});
        }

        function updateNotifBadge() {
            fetch('/student/api/notifications/unread-count')
                .then(r => r.json())
                .then(data => {
                    const badge = document.getElementById('notifBadge');
                    if (data.count > 0) {
                        badge.textContent = data.count > 99 ? '99+' : data.count;
                        badge.classList.remove('hidden');
                    } else {
                        badge.classList.add('hidden');
                    }
                }).catch(() => {});
        }
        updateNotifBadge();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('notifDropdown').classList.add('hidden');
                document.getElementById('profileDropdown').classList.add('hidden');
                notifOpen = false;
                profileOpen = false;
            }
        });

        if (window.innerWidth < 768) {
            document.querySelectorAll('#sidebar a[href]').forEach(link => {
                if (link.getAttribute('href') !== '#') {
                    link.addEventListener('click', () => {
                        sidebar.classList.add('-translate-x-full');
                        sidebarOverlay.classList.add('hidden');
                    });
                }
            });
        }
    </script>
</body>
</html>
