<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base-head :: head('404 Not Found | EduTake')}"></head>

<body class="bg-surface-950 text-white antialiased h-screen flex flex-col">

    <div th:replace="~{fragments/tw-navbar :: navbar}"></div>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="text-center max-w-md">
            
            <div class="relative w-32 h-32 mx-auto mb-8">
                <div class="absolute inset-0 bg-brand-500/20 rounded-full blur-2xl animate-pulse"></div>
                <div class="relative bg-surface-900 border border-white/10 rounded-full w-full h-full flex items-center justify-center shadow-2xl">
                    <span class="text-5xl font-extrabold text-brand-400">404</span>
                </div>
            </div>

            <h1 class="text-3xl font-bold mb-4">Page Not Found</h1>
            <p class="text-gray-400 mb-8 leading-relaxed">
                Oops! It seems the page you're looking for doesn't exist, has been moved, or is temporarily unavailable.
            </p>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/index" class="px-6 py-3 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl transition-all shadow-lg shadow-brand-600/20">
                    Return to Home
                </a>
                <a href="/courses" class="px-6 py-3 border border-white/10 hover:border-white/20 hover:bg-white/5 text-white font-medium rounded-xl transition-all">
                    Browse Courses
                </a>
            </div>
            
        </div>
    </main>

    <div th:replace="~{fragments/tw-footer :: footer}"></div>

</body>
</html>
