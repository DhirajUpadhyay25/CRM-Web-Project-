<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base-head :: head('Login')}"></head>

<body class="bg-surface-950 text-white antialiased min-h-screen flex flex-col pt-16">

    <!-- Navbar -->
    <div th:replace="~{fragments/tw-navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-16 relative overflow-hidden">
        <!-- Background Glow Effects -->
        <div class="absolute inset-0 pointer-events-none">
            <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-brand-600/10 rounded-full blur-[130px]"></div>
            <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-[130px]"></div>
        </div>

        <div class="w-full max-w-md relative z-10 animate-fade-in">
            
            <!-- Back to Home link -->
            <div class="mb-4 text-left">
                <a href="/index" class="inline-flex items-center gap-1.5 text-xs font-bold text-gray-400 hover:text-white transition-colors">
                    <i class="bi bi-arrow-left"></i>
                    <span>Back to Home</span>
                </a>
            </div>

            <!-- Login Card -->
            <div class="bg-surface-900/60 backdrop-blur-xl border border-white/10 rounded-3xl p-8 shadow-2xl">
                
                <!-- Brand logo and Welcome header -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center gap-2 mb-4">
                        <div class="w-8 h-8 bg-gradient-to-br from-brand-500 to-brand-700 rounded-lg flex items-center justify-center font-bold text-white text-sm">E</div>
                        <span class="font-extrabold text-xl tracking-tight text-white">EduTake<span class="text-brand-500">.</span></span>
                    </div>
                    <h1 class="text-2xl font-black text-white tracking-tight">Welcome Back</h1>
                    <p class="text-xs text-gray-400 mt-1">Sign in to continue your learning journey</p>
                </div>

                <!-- Success Message (Logout) -->
                <div th:if="${param.logout}" class="mb-6 flex items-start gap-3 p-4 bg-green-500/10 border border-green-500/20 rounded-xl">
                    <i class="bi bi-check-circle-fill text-green-400 mt-0.5"></i>
                    <p class="text-xs text-green-300">You have been successfully logged out.</p>
                </div>

                <!-- Error Message -->
                <div th:if="${param.error}" class="mb-6 flex items-start gap-3 p-4 bg-red-500/10 border border-red-500/20 rounded-xl">
                    <i class="bi bi-exclamation-circle-fill text-red-400 mt-0.5"></i>
                    <p class="text-xs text-red-300">Invalid email or password. Please try again.</p>
                </div>

                <!-- Login Form -->
                <form th:action="@{/loginForm}" method="post" class="space-y-5">
                    
                    <!-- Email input -->
                    <div class="space-y-1.5 text-left">
                        <label for="email" class="block text-xs font-bold text-gray-300 uppercase tracking-wider">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="bi bi-envelope text-gray-500"></i>
                            </div>
                            <input type="email" id="email" name="email" required
                                   class="w-full pl-11 pr-4 py-3 bg-surface-950/40 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm transition-all"
                                   placeholder="you@example.com">
                        </div>
                    </div>

                    <!-- Password input -->
                    <div class="space-y-1.5 text-left">
                        <div class="flex items-center justify-between">
                            <label for="password" class="block text-xs font-bold text-gray-300 uppercase tracking-wider">Password</label>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="bi bi-lock text-gray-500"></i>
                            </div>
                            <input type="password" id="password" name="password" required
                                   class="w-full pl-11 pr-4 py-3 bg-surface-950/40 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent text-sm transition-all"
                                   placeholder="••••••••">
                        </div>
                    </div>

                    <!-- Submit action button -->
                    <div class="pt-2">
                        <button type="submit"
                                class="w-full py-3.5 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl transition-all shadow-md shadow-brand-600/10 hover:shadow-brand-500/25 hover:-translate-y-0.5 flex items-center justify-center gap-2 text-sm">
                            <span>Sign In</span>
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </form>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/5"></div></div>
                    <div class="relative flex justify-center text-[10px] font-bold uppercase tracking-wider"><span class="bg-surface-900/60 px-4 text-gray-500">or</span></div>
                </div>

                <!-- Registration link redirect -->
                <p class="text-center text-xs text-gray-400 font-semibold">
                    Don't have an account?
                    <a href="/register" class="text-brand-400 hover:text-brand-300 ml-1 transition-colors">Create one free</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/tw-footer :: footer}"></div>

</body>
</html>
