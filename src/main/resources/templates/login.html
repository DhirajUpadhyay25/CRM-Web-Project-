<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base-head :: head('Login')}"></head>

<body class="bg-surface-950 text-white antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <div th:replace="~{fragments/tw-navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-24 relative overflow-hidden mt-16">
        <!-- Background Elements -->
        <div class="absolute inset-0 pointer-events-none">
            <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-brand-600/10 rounded-full blur-[120px]"></div>
            <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-[120px]"></div>
        </div>

        <div class="w-full max-w-md relative z-10 animate-fade-in">
            <!-- Login Card -->
            <div class="bg-surface-900/80 backdrop-blur-xl border border-white/10 rounded-3xl p-8 shadow-2xl">
                
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 shadow-lg shadow-brand-500/30 mb-6">
                        <i class="bi bi-person-fill text-3xl text-white"></i>
                    </div>
                    <h1 class="text-3xl font-bold tracking-tight">Welcome Back</h1>
                    <p class="text-gray-400 mt-2">Sign in to continue your learning journey</p>
                </div>

                <!-- Success Message (Logout) -->
                <div th:if="${param.logout}" class="mb-6 flex items-start gap-3 p-4 bg-green-500/10 border border-green-500/20 rounded-xl">
                    <i class="bi bi-check-circle-fill text-green-400 mt-0.5"></i>
                    <p class="text-sm text-green-300">You have been successfully logged out.</p>
                </div>

                <!-- Error Message -->
                <div th:if="${param.error}" class="mb-6 flex items-start gap-3 p-4 bg-red-500/10 border border-red-500/20 rounded-xl">
                    <i class="bi bi-exclamation-circle-fill text-red-400 mt-0.5"></i>
                    <p class="text-sm text-red-300">Invalid email or password. Please try again.</p>
                </div>

                <!-- Login Form -->
                <form th:action="@{/loginForm}" method="post" class="space-y-5">
                    <div class="space-y-1.5">
                        <label for="email" class="block text-sm font-medium text-gray-300">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="bi bi-envelope text-gray-500"></i>
                            </div>
                            <input type="email" id="email" name="email" required
                                   class="w-full pl-11 pr-4 py-3 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all"
                                   placeholder="you@example.com">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i class="bi bi-lock text-gray-500"></i>
                            </div>
                            <input type="password" id="password" name="password" required
                                   class="w-full pl-11 pr-4 py-3 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all"
                                   placeholder="••••••••">
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit"
                                class="w-full py-3.5 bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-brand-600/20 hover:shadow-brand-500/30 flex items-center justify-center gap-2">
                            <span>Sign In</span>
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>
                </form>

                <!-- Divider -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/5"></div></div>
                    <div class="relative flex justify-center text-xs"><span class="bg-surface-900 px-4 text-gray-500 uppercase tracking-wider">or</span></div>
                </div>

                <!-- Register Link -->
                <p class="text-center text-gray-400">
                    Don't have an account?
                    <a href="/register" class="text-brand-400 hover:text-brand-300 font-semibold transition-colors ml-1">Create one free</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/tw-footer :: footer}"></div>

</body>
</html>
