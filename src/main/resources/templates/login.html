<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base-head :: head('Login')}"></head>

<body class="bg-surface-950 text-white antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <div th:replace="~{fragments/tw-navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-md animate-fade-in">

            <!-- Login Card -->
            <div class="bg-surface-900 border border-white/5 rounded-2xl p-8 shadow-2xl">

                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="w-14 h-14 bg-brand-600/10 border border-brand-600/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i class="bi bi-person-fill text-2xl text-brand-400"></i>
                    </div>
                    <h1 class="text-2xl font-bold">Welcome Back</h1>
                    <p class="text-sm text-gray-400 mt-2">Sign in to continue your learning journey</p>
                </div>

                <!-- Success Message (Logout) -->
                <div th:if="${param.logout}" class="mb-6 flex items-center gap-3 px-4 py-3 bg-green-500/10 border border-green-500/20 rounded-xl">
                    <i class="bi bi-check-circle text-green-400"></i>
                    <span class="text-sm text-green-300">You have been logged out successfully.</span>
                </div>

                <!-- Error Message -->
                <div th:if="${param.error}" class="mb-6 flex items-center gap-3 px-4 py-3 bg-red-500/10 border border-red-500/20 rounded-xl">
                    <i class="bi bi-exclamation-circle text-red-400"></i>
                    <span class="text-sm text-red-300">Invalid email or password.</span>
                </div>

                <!-- Login Form -->
                <form th:action="@{/loginForm}" method="post" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1.5">Email Address</label>
                        <input type="email" name="email" required
                               class="w-full px-4 py-3 bg-surface-800 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all"
                               placeholder="you@example.com">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                        <input type="password" name="password" required
                               class="w-full px-4 py-3 bg-surface-800 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all"
                               placeholder="Enter your password">
                    </div>

                    <button type="submit"
                            class="w-full py-3.5 bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-brand-600/20 hover:shadow-brand-500/30">
                        Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/5"></div></div>
                    <div class="relative flex justify-center text-xs"><span class="bg-surface-900 px-4 text-gray-500">or</span></div>
                </div>

                <!-- Register Link -->
                <p class="text-center text-sm text-gray-400">
                    Don't have an account?
                    <a href="/register" class="text-brand-400 hover:text-brand-300 font-semibold transition-colors">Create one free</a>
                </p>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/tw-footer :: tw-footer}"></div>

</body>
</html>
