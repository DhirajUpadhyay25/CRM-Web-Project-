<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/admin-layout :: layout('Students', ~{::div})}">
<body>
    <div>
        <div class="mb-6 border-b border-surface-200 pb-4">
            <h1 class="text-2xl font-bold text-surface-900 mb-1">Student Management</h1>
            <p class="text-gray-500 text-sm">View and manage registered students and customers.</p>
        </div>

        <!-- Alerts -->
        <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 flex items-center gap-3">
            <i class="bi bi-check-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-center gap-3">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${errorMsg}"></span>
        </div>

        <div class="bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="p-6 border-b border-surface-200 bg-surface-50 flex items-center justify-between">
                <h2 class="font-bold text-surface-900">All Students</h2>
            </div>
            
            <div th:if="${#lists.isEmpty(userPage.content)}" class="p-12 text-center">
                <div class="w-16 h-16 bg-surface-100 rounded-full flex items-center justify-center text-gray-400 text-2xl mx-auto mb-4">
                    <i class="bi bi-people"></i>
                </div>
                <h3 class="font-semibold text-surface-900 mb-1">No Students Found</h3>
                <p class="text-sm text-gray-500">There are no students registered yet.</p>
            </div>
            
            <div th:if="${!#lists.isEmpty(userPage.content)}" class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-surface-50 border-b border-surface-200 text-gray-500">
                        <tr>
                            <th class="px-6 py-4 font-semibold">Name</th>
                            <th class="px-6 py-4 font-semibold">Email</th>
                            <th class="px-6 py-4 font-semibold">Phone</th>
                            <th class="px-6 py-4 font-semibold">City</th>
                            <th class="px-6 py-4 font-semibold">Status</th>
                            <th class="px-6 py-4 font-semibold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-surface-200">
                        <tr th:each="user : ${userPage.content}" class="hover:bg-surface-50 transition-colors">
                            <td class="px-6 py-4 font-medium text-surface-900" th:text="${user.name}"></td>
                            <td class="px-6 py-4 text-gray-500" th:text="${user.email}"></td>
                            <td class="px-6 py-4 text-gray-500" th:text="${user.phoneno}"></td>
                            <td class="px-6 py-4 text-gray-500" th:text="${user.city}"></td>
                            <td class="px-6 py-4">
                                <span th:if="${user.banStatus}" class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-red-50 text-red-600 border border-red-200">Banned</span>
                                <span th:unless="${user.banStatus}" class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-green-50 text-green-600 border border-green-200">Active</span>
                            </td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <a th:href="@{/admin/students/courses(userEmail=${user.email}, userName=${user.name})}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-surface-100 text-brand-600 hover:bg-brand-50 hover:text-brand-700 transition-colors" title="View Courses">
                                    <i class="bi bi-book"></i>
                                </a>
                                <a th:if="${!user.banStatus}" th:href="@{/admin/students/ban(userEmail=${user.email}, banStatus=true)}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-surface-100 text-orange-600 hover:bg-orange-50 hover:text-orange-700 transition-colors" title="Ban User" onclick="return confirm('Are you sure you want to ban this student?');">
                                    <i class="bi bi-slash-circle"></i>
                                </a>
                                <a th:if="${user.banStatus}" th:href="@{/admin/students/ban(userEmail=${user.email}, banStatus=false)}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-surface-100 text-green-600 hover:bg-green-50 hover:text-green-700 transition-colors" title="Unban User">
                                    <i class="bi bi-check-circle"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div th:if="${userPage.totalPages > 1}" class="px-6 py-4 border-t border-surface-200 flex flex-col sm:flex-row items-center justify-between bg-surface-50 gap-4">
                <div class="text-sm text-gray-500">
                    Showing <span class="font-medium text-surface-900" th:text="${userPage.number * userPage.size + 1}"></span> to 
                    <span class="font-medium text-surface-900" th:text="${userPage.isLast() ? userPage.totalElements : (userPage.number + 1) * userPage.size}"></span> of 
                    <span class="font-medium text-surface-900" th:text="${userPage.totalElements}"></span> results
                </div>
                <div class="flex items-center gap-2">
                    <a th:if="${userPage.hasPrevious()}" 
                       th:href="@{/admin/students(page=${userPage.number - 1}, size=${userPage.size})}"
                       class="px-3 py-1.5 rounded-lg bg-white border border-surface-200 text-sm font-medium hover:bg-surface-50 text-surface-700 transition-colors">
                        Previous
                    </a>
                    <a th:if="${userPage.hasNext()}" 
                       th:href="@{/admin/students(page=${userPage.number + 1}, size=${userPage.size})}"
                       class="px-3 py-1.5 rounded-lg bg-white border border-surface-200 text-sm font-medium hover:bg-surface-50 text-surface-700 transition-colors">
                        Next
                    </a>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
