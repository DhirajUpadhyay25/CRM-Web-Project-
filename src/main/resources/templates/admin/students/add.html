<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/admin-layout :: layout('Add Student', ~{::div})}">
<body>
    <div>
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-xs text-gray-500 mb-3 font-medium">
            <a href="/admin/dashboard" class="hover:text-brand-600 transition-colors">Admin</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <a href="/admin/students" class="hover:text-brand-600 transition-colors">Students</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <span class="text-surface-900 font-semibold">Add Student</span>
        </nav>

        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-5 border-b border-surface-200">
            <div class="flex items-center gap-4">
                <a href="/admin/students" class="p-2 rounded-xl bg-white border border-surface-200 text-gray-500 hover:text-surface-900 hover:bg-surface-50 transition-colors shadow-sm">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-extrabold text-surface-900 tracking-tight">Add New Student</h1>
                    <p class="text-gray-500 text-sm mt-0.5">Create a new student account in the system.</p>
                </div>
            </div>
        </div>

        <!-- Form Card -->
        <div class="max-w-2xl">
            <form th:action="@{/admin/students/new}" th:object="${newStudent}" method="post" class="bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden">
                
                <!-- Personal Information -->
                <div class="p-6 border-b border-surface-100">
                    <h3 class="text-sm font-bold text-surface-900 mb-4 flex items-center gap-2">
                        <i class="bi bi-person text-brand-600"></i>
                        Personal Information
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="name" class="block text-xs font-semibold text-gray-600 mb-1.5">Full Name <span class="text-red-500">*</span></label>
                            <input type="text" id="name" th:field="*{name}" required
                                   class="w-full px-3.5 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm transition-all"
                                   placeholder="Enter full name">
                            <p class="text-xs text-red-500 mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</p>
                        </div>
                        <div>
                            <label for="email" class="block text-xs font-semibold text-gray-600 mb-1.5">Email Address <span class="text-red-500">*</span></label>
                            <input type="email" id="email" th:field="*{email}" required
                                   class="w-full px-3.5 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm transition-all"
                                   placeholder="student@example.com">
                            <p class="text-xs text-red-500 mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</p>
                        </div>
                        <div>
                            <label for="phoneno" class="block text-xs font-semibold text-gray-600 mb-1.5">Phone Number</label>
                            <input type="text" id="phoneno" th:field="*{phoneno}"
                                   class="w-full px-3.5 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm transition-all"
                                   placeholder="10-digit phone number">
                            <p class="text-xs text-red-500 mt-1" th:if="${#fields.hasErrors('phoneno')}" th:errors="*{phoneno}">Error</p>
                        </div>
                        <div>
                            <label for="city" class="block text-xs font-semibold text-gray-600 mb-1.5">City</label>
                            <input type="text" id="city" th:field="*{city}"
                                   class="w-full px-3.5 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm transition-all"
                                   placeholder="City name">
                            <p class="text-xs text-red-500 mt-1" th:if="${#fields.hasErrors('city')}" th:errors="*{city}">Error</p>
                        </div>
                    </div>
                </div>

                <!-- Account Credentials -->
                <div class="p-6">
                    <h3 class="text-sm font-bold text-surface-900 mb-4 flex items-center gap-2">
                        <i class="bi bi-shield-lock text-brand-600"></i>
                        Account Credentials
                    </h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="password" class="block text-xs font-semibold text-gray-600 mb-1.5">Password <span class="text-red-500">*</span></label>
                            <input type="password" id="password" name="password" required minlength="6"
                                   class="w-full px-3.5 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm transition-all"
                                   placeholder="Minimum 6 characters">
                        </div>
                        <div>
                            <label for="confirmPassword" class="block text-xs font-semibold text-gray-600 mb-1.5">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   class="w-full px-3.5 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm transition-all"
                                   placeholder="Re-enter password">
                        </div>
                    </div>
                    <p class="text-xs text-gray-400 mt-3"><i class="bi bi-info-circle mr-1"></i> The student will use this password to log in to the platform.</p>
                </div>

                <!-- Submit -->
                <div class="px-6 py-4 bg-surface-50 border-t border-surface-200 flex items-center justify-end gap-3">
                    <a href="/admin/students" class="px-4 py-2.5 text-gray-600 hover:text-surface-900 transition-colors text-sm font-medium">Cancel</a>
                    <button type="submit" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-sm hover:shadow transition-all text-sm flex items-center gap-2">
                        <i class="bi bi-plus-lg"></i>
                        Create Student
                    </button>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
