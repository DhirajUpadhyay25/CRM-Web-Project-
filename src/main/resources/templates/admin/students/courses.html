<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/admin-layout :: layout('Student Courses', ~{::div})}">
<body>
    <div>
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-xs text-gray-500 mb-3 font-medium">
            <a href="/admin/dashboard" class="hover:text-brand-600 transition-colors">Admin</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <a href="/admin/students" class="hover:text-brand-600 transition-colors">Students</a>
            <i class="bi bi-chevron-right text-[10px] text-gray-400"></i>
            <span class="text-surface-900 font-semibold" th:text="${custName} + '\'s Courses'">Courses</span>
        </nav>

        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-5 border-b border-surface-200">
            <div class="flex items-center gap-4">
                <a href="/admin/students" class="p-2 rounded-xl bg-white border border-surface-200 text-gray-500 hover:text-surface-900 hover:bg-surface-50 transition-colors shadow-sm">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-extrabold text-surface-900 tracking-tight" th:text="${custName} + '\'s Enrollments'">Student Enrollments</h1>
                    <p class="text-gray-500 text-sm mt-0.5" th:text="${custEmail}">email@example.com</p>
                </div>
            </div>
        </div>

        <!-- Enrollments -->
        <div class="bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden">
            
            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(enrollments)}" class="p-12 text-center">
                <div class="w-16 h-16 bg-surface-100 rounded-2xl flex items-center justify-center mx-auto mb-3 text-gray-400 text-2xl">
                    <i class="bi bi-journal-x"></i>
                </div>
                <h3 class="text-base font-bold text-surface-900 mb-1">No courses enrolled</h3>
                <p class="text-gray-500 text-xs max-w-sm mx-auto">This student has not been enrolled in any courses yet.</p>
            </div>

            <!-- Table -->
            <div th:unless="${#lists.isEmpty(enrollments)}" class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-surface-50 border-b border-surface-200 text-gray-500 text-xs uppercase font-semibold tracking-wider">
                        <tr>
                            <th class="py-3.5 px-6">Course</th>
                            <th class="py-3.5 px-4">Status</th>
                            <th class="py-3.5 px-4">Payment</th>
                            <th class="py-3.5 px-4">Enrolled At</th>
                            <th class="py-3.5 px-4">Completed At</th>
                            <th class="py-3.5 px-6 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-surface-200">
                        <tr th:each="enrollment : ${enrollments}" class="hover:bg-surface-50/70 transition-colors">
                            <td class="py-3.5 px-6">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-lg bg-surface-100 flex-shrink-0 overflow-hidden border border-surface-200">
                                        <img th:if="${enrollment.course.imageUrl}" th:src="@{${enrollment.course.imageUrl}}" class="w-full h-full object-cover" alt="Course" onerror="this.parentElement.innerHTML='<div class=\'w-full h-full flex items-center justify-center text-gray-400\'><i class=\'bi bi-play-btn\'></i></div>'">
                                        <div th:unless="${enrollment.course.imageUrl}" class="w-full h-full flex items-center justify-center text-gray-400">
                                            <i class="bi bi-play-btn"></i>
                                        </div>
                                    </div>
                                    <div>
                                        <a th:href="@{/admin/courses/{id}(id=${enrollment.course.id})}" class="font-semibold text-surface-900 hover:text-brand-600 transition-colors" th:text="${enrollment.course.name}">Course</a>
                                    </div>
                                </div>
                            </td>
                            <td class="py-3.5 px-4">
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold"
                                      th:classappend="${enrollment.status.name() == 'ACTIVE' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : (enrollment.status.name() == 'COMPLETED' ? 'bg-blue-50 text-blue-700 border border-blue-200' : (enrollment.status.name() == 'CANCELLED' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-orange-50 text-orange-700 border border-orange-200'))}"
                                      th:text="${enrollment.status}">Status</span>
                            </td>
                            <td class="py-3.5 px-4 text-xs text-gray-600" th:text="${enrollment.paymentStatus ?: '—'}">—</td>
                            <td class="py-3.5 px-4 text-xs text-gray-500">
                                <span th:if="${enrollment.enrolledAt}" th:text="${#temporals.format(enrollment.enrolledAt, 'dd MMM yyyy')}">Date</span>
                                <span th:unless="${enrollment.enrolledAt}" class="text-gray-400">—</span>
                            </td>
                            <td class="py-3.5 px-4 text-xs text-gray-500">
                                <span th:if="${enrollment.completedAt}" th:text="${#temporals.format(enrollment.completedAt, 'dd MMM yyyy')}">Date</span>
                                <span th:unless="${enrollment.completedAt}" class="text-gray-400">—</span>
                            </td>
                            <td class="py-3.5 px-6 text-right">
                                <a th:href="@{/admin/courses/{id}(id=${enrollment.course.id})}" class="p-1.5 text-gray-500 hover:text-brand-600 hover:bg-brand-50 rounded-lg transition-colors" title="View Course">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>
</html>
