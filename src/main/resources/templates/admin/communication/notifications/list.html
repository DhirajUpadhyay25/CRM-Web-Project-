<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/admin-layout :: layout('Notifications', ~{::div})}">
<body>
    <div>

        <!-- Header -->
        <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-surface-200 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-surface-900 mb-1">Notifications</h1>
                <p class="text-gray-500 text-sm">Manage platform notifications.</p>
            </div>
            <form th:action="@{/admin/notifications/mark-all-read}" method="post" class="inline">
                <button type="submit" class="px-4 py-2 border border-surface-200 text-surface-700 font-medium rounded-lg shadow-sm transition-all flex items-center gap-2 text-sm hover:bg-surface-50">
                    <i class="bi bi-check-all"></i> Mark All as Read
                </button>
            </form>
        </div>

        <!-- Alerts -->
        <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 flex items-center gap-3">
            <i class="bi bi-check-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-center gap-3">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${errorMsg}"></span>
        </div>

        <!-- Stats Bar -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-white rounded-xl p-4 border border-surface-200 shadow-sm">
                <p class="text-xs font-semibold text-gray-500 mb-1">Total Notifications</p>
                <p class="text-xl font-bold text-surface-900" th:text="${totalNotifications ?: 0}">0</p>
            </div>
            <div class="bg-white rounded-xl p-4 border border-surface-200 shadow-sm">
                <p class="text-xs font-semibold text-gray-500 mb-1">Unread</p>
                <p class="text-xl font-bold text-red-600" th:text="${unreadCount ?: 0}">0</p>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl border border-surface-200 shadow-sm overflow-hidden">

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(notificationPage.content)}" class="p-12 text-center">
                <div class="w-16 h-16 bg-surface-100 rounded-full flex items-center justify-center text-gray-400 text-2xl mx-auto mb-4">
                    <i class="bi bi-bell"></i>
                </div>
                <h3 class="font-semibold text-surface-900 mb-1">No Notifications</h3>
                <p class="text-sm text-gray-500">No notifications have been generated yet.</p>
            </div>

            <div th:if="${!#lists.isEmpty(notificationPage.content)}" class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-surface-50 border-b border-surface-200 text-gray-500">
                        <tr>
                            <th class="px-6 py-3 font-semibold">Title</th>
                            <th class="px-6 py-3 font-semibold">Message</th>
                            <th class="px-6 py-3 font-semibold">Type</th>
                            <th class="px-6 py-3 font-semibold">Recipient</th>
                            <th class="px-6 py-3 font-semibold">Read</th>
                            <th class="px-6 py-3 font-semibold">Created</th>
                            <th class="px-6 py-3 font-semibold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-surface-200">
                        <tr th:each="notif : ${notificationPage.content}" class="hover:bg-surface-50 transition-colors"
                            th:classappend="${!notif.read ? 'bg-brand-50/30' : ''}">
                            <td class="px-6 py-4 font-medium text-surface-900" th:text="${notif.title}"></td>
                            <td class="px-6 py-4 text-gray-500 max-w-[200px] truncate" th:text="${notif.message}"></td>
                            <td class="px-6 py-4">
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold"
                                      th:classappend="${notif.type == 'NEW_STUDENT' ? 'bg-blue-50 text-blue-600' : (notif.type == 'NEW_ORDER' ? 'bg-green-50 text-green-600' : (notif.type == 'PAYMENT_RECEIVED' ? 'bg-emerald-50 text-emerald-600' : (notif.type == 'NEW_ENQUIRY' ? 'bg-orange-50 text-orange-600' : (notif.type == 'NEW_LEAD' ? 'bg-purple-50 text-purple-600' : (notif.type == 'NEW_FEEDBACK' ? 'bg-cyan-50 text-cyan-600' : (notif.type == 'COURSE_ATTENTION' ? 'bg-amber-50 text-amber-600' : (notif.type == 'SYSTEM_WARNING' ? 'bg-red-50 text-red-600' : 'bg-gray-50 text-gray-600')))))))}"
                                      th:text="${notif.type}">—</span>
                            </td>
                            <td class="px-6 py-4 text-gray-500" th:text="${notif.recipientEmail ?: 'All'}"></td>
                            <td class="px-6 py-4">
                                <i th:if="${notif.read}" class="bi bi-check-circle-fill text-green-500"></i>
                                <i th:unless="${notif.read}" class="bi bi-circle text-gray-300"></i>
                            </td>
                            <td class="px-6 py-4 text-gray-400 text-xs" th:text="${notif.createdAt}">—</td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <a th:if="${!notif.read}" th:href="@{/admin/notifications/mark-read(id=${notif.id})}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-surface-100 text-brand-600 hover:bg-brand-50 hover:text-brand-700 transition-colors" title="Mark as Read">
                                    <i class="bi bi-envelope-open"></i>
                                </a>
                                <a th:href="@{/admin/notifications/delete(id=${notif.id})}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-surface-100 text-red-600 hover:bg-red-50 hover:text-red-700 transition-colors" title="Delete" onclick="return confirm('Are you sure you want to delete this notification?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${notificationPage.totalPages > 1}" class="px-6 py-4 border-t border-surface-200 flex flex-col sm:flex-row items-center justify-between bg-surface-50 gap-4">
                <div class="text-sm text-gray-500">
                    Showing <span class="font-medium text-surface-900" th:text="${notificationPage.number * notificationPage.size + 1}"></span> to
                    <span class="font-medium text-surface-900" th:text="${notificationPage.isLast() ? notificationPage.totalElements : (notificationPage.number + 1) * notificationPage.size}"></span> of
                    <span class="font-medium text-surface-900" th:text="${notificationPage.totalElements}"></span> results
                </div>
                <div class="flex items-center gap-2">
                    <a th:if="${notificationPage.hasPrevious()}"
                       th:href="@{/admin/notifications(page=${notificationPage.number - 1}, size=${notificationPage.size})}"
                       class="px-3 py-1.5 rounded-lg bg-white border border-surface-200 text-sm font-medium hover:bg-surface-50 text-surface-700 transition-colors">
                        Previous
                    </a>
                    <a th:if="${notificationPage.hasNext()}"
                       th:href="@{/admin/notifications(page=${notificationPage.number + 1}, size=${notificationPage.size})}"
                       class="px-3 py-1.5 rounded-lg bg-white border border-surface-200 text-sm font-medium hover:bg-surface-50 text-surface-700 transition-colors">
                        Next
                    </a>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
