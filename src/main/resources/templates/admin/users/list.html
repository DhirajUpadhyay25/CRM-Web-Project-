<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/admin-layout :: layout('Users', ~{::div})}">
<body>
    <div>
        <div class="mb-6 flex items-center justify-between border-b border-surface-200 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-surface-900 mb-1">Platform Users (Staff)</h1>
                <p class="text-gray-500 text-sm">Manage employee and staff accounts.</p>
            </div>
            <a href="/admin/users/new" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg shadow-sm transition-all flex items-center gap-2 text-sm">
                <i class="bi bi-person-plus"></i> Add New Staff
            </a>
        </div>

        <!-- Alerts -->
        <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 flex items-center gap-3">
            <i class="bi bi-check-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-center gap-3">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${errorMsg}"></span>
        </div>

        <div class="bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="p-6 border-b border-surface-200 bg-surface-50">
                <h2 class="font-bold text-surface-900">All Staff</h2>
            </div>
            
            <div th:if="${#lists.isEmpty(employeePage.content)}" class="p-12 text-center">
                <div class="w-16 h-16 bg-surface-100 rounded-full flex items-center justify-center text-gray-400 text-2xl mx-auto mb-4">
                    <i class="bi bi-people"></i>
                </div>
                <h3 class="font-semibold text-surface-900 mb-1">No Staff Found</h3>
                <p class="text-sm text-gray-500">There are no employee records yet.</p>
            </div>
            
            <div th:if="${!#lists.isEmpty(employeePage.content)}" class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-surface-50 border-b border-surface-200 text-gray-500">
                        <tr>
                            <th class="px-6 py-4 font-semibold">Name</th>
                            <th class="px-6 py-4 font-semibold">Email</th>
                            <th class="px-6 py-4 font-semibold">Phone</th>
                            <th class="px-6 py-4 font-semibold">Department</th>
                            <th class="px-6 py-4 font-semibold">Role</th>
                            <th class="px-6 py-4 font-semibold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-surface-200">
                        <tr th:each="emp : ${employeePage.content}" class="hover:bg-surface-50 transition-colors">
                            <td class="px-6 py-4 font-medium text-surface-900" th:text="${emp.name}"></td>
                            <td class="px-6 py-4 text-gray-500" th:text="${emp.email}"></td>
                            <td class="px-6 py-4 text-gray-500" th:text="${emp.phoneno}"></td>
                            <td class="px-6 py-4 text-gray-500" th:text="${emp.department}"></td>
                            <td class="px-6 py-4 text-gray-500" th:text="${emp.empRole}"></td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <a th:href="@{/admin/users/edit(employeeEmail=${emp.email})}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-surface-100 text-brand-600 hover:bg-brand-50 hover:text-brand-700 transition-colors" title="Edit Staff">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/admin/users/delete(employeeEmail=${emp.email})}" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-surface-100 text-red-600 hover:bg-red-50 hover:text-red-700 transition-colors" title="Delete Staff" onclick="return confirm('Are you sure you want to delete this staff record?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div th:if="${employeePage.totalPages > 1}" class="px-6 py-4 border-t border-surface-200 flex flex-col sm:flex-row items-center justify-between bg-surface-50 gap-4">
                <div class="text-sm text-gray-500">
                    Showing <span class="font-medium text-surface-900" th:text="${employeePage.number * employeePage.size + 1}"></span> to 
                    <span class="font-medium text-surface-900" th:text="${employeePage.isLast() ? employeePage.totalElements : (employeePage.number + 1) * employeePage.size}"></span> of 
                    <span class="font-medium text-surface-900" th:text="${employeePage.totalElements}"></span> results
                </div>
                <div class="flex items-center gap-2">
                    <a th:if="${employeePage.hasPrevious()}" 
                       th:href="@{/admin/users(page=${employeePage.number - 1}, size=${employeePage.size})}"
                       class="px-3 py-1.5 rounded-lg bg-white border border-surface-200 text-sm font-medium hover:bg-surface-50 text-surface-700 transition-colors">
                        Previous
                    </a>
                    <a th:if="${employeePage.hasNext()}" 
                       th:href="@{/admin/users(page=${employeePage.number + 1}, size=${employeePage.size})}"
                       class="px-3 py-1.5 rounded-lg bg-white border border-surface-200 text-sm font-medium hover:bg-surface-50 text-surface-700 transition-colors">
                        Next
                    </a>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
