<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/admin-layout :: layout('Edit User', ~{::div})}">
<body>
    <div>
        <div class="mb-6 flex items-center gap-4 border-b border-surface-200 pb-4">
            <a href="/admin/users" class="w-10 h-10 rounded-xl bg-white border border-surface-200 shadow-sm flex items-center justify-center text-gray-500 hover:text-brand-600 hover:bg-surface-50 transition-colors">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-2xl font-bold text-surface-900 mb-1">Edit Platform User</h1>
                <p class="text-gray-500 text-sm">Update employee or staff account details.</p>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 flex items-center gap-3 shadow-sm">
            <i class="bi bi-check-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-center gap-3 shadow-sm">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${errorMsg}"></span>
        </div>

        <div class="max-w-2xl bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="p-6 border-b border-surface-200 bg-surface-50">
                <h2 class="font-bold text-surface-900">User Details</h2>
            </div>
            
            <form th:action="@{/admin/users/edit}" method="post" th:object="${newEmployeeObj}" class="p-6 space-y-5">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name *</label>
                        <input type="text" name="name" th:value="${employee.name}" required
                               class="w-full px-4 py-2.5 bg-white border border-surface-300 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-shadow">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email Address (Read-only)</label>
                        <input type="email" name="email" th:value="${employee.email}" readonly
                               class="w-full px-4 py-2.5 bg-surface-50 border border-surface-200 rounded-xl text-gray-500 cursor-not-allowed">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Phone Number *</label>
                        <input type="text" name="phoneno" th:value="${employee.phoneno}" required
                               class="w-full px-4 py-2.5 bg-white border border-surface-300 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-shadow">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">City *</label>
                        <input type="text" name="city" th:value="${employee.city}" required
                               class="w-full px-4 py-2.5 bg-white border border-surface-300 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-shadow">
                    </div>
                </div>
                
                <div class="pt-4 border-t border-surface-200 flex justify-end gap-3">
                    <a href="/admin/users" class="px-5 py-2.5 bg-white border border-surface-300 text-gray-700 font-medium rounded-xl hover:bg-surface-50 transition-colors">Cancel</a>
                    <button type="submit" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl shadow-sm transition-colors flex items-center gap-2">
                        <i class="bi bi-check2"></i> Save Changes
                    </button>
                </div>
                
            </form>
        </div>
    </div>
</body>
</html>
