<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/admin-layout :: layout('Add User', ~{::div})}">
<body>
    <div>
        <div class="mb-6 flex items-center gap-4 border-b border-surface-200 pb-4">
            <a href="/admin/users" class="w-10 h-10 rounded-xl bg-white border border-surface-200 shadow-sm flex items-center justify-center text-gray-500 hover:text-brand-600 hover:bg-surface-50 transition-colors">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-2xl font-bold text-surface-900 mb-1">Add Platform User</h1>
                <p class="text-gray-500 text-sm">Create a new employee, staff or instructor account with RBAC governance.</p>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 flex items-center gap-3 shadow-sm">
            <i class="bi bi-check-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-center gap-3 shadow-sm">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${errorMsg}"></span>
        </div>

        <div class="max-w-2xl bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="p-6 border-b border-surface-200 bg-surface-50">
                <h2 class="font-bold text-surface-900">User Identity &amp; Role</h2>
            </div>
            
            <form th:action="@{/admin/users/new}" method="post" th:object="${employee}" class="p-6 space-y-5">
                <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Full Name *</label>
                        <input type="text" name="name" th:field="*{name}" required
                               class="w-full px-4 py-2.5 bg-white border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Email Address *</label>
                        <input type="email" name="email" th:field="*{email}" required
                               class="w-full px-4 py-2.5 bg-white border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-medium">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Phone Number *</label>
                        <input type="text" name="phoneno" th:field="*{phoneno}" required
                               class="w-full px-4 py-2.5 bg-white border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">City / Location *</label>
                        <input type="text" name="city" th:field="*{city}" required
                               class="w-full px-4 py-2.5 bg-white border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-medium">
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Password *</label>
                        <input type="password" name="password" th:field="*{password}" required
                               class="w-full px-4 py-2.5 bg-white border border-surface-200 rounded-xl text-surface-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Assign RBAC System Role</label>
                        <select name="roleId" class="w-full px-4 py-2.5 bg-white border border-surface-200 rounded-xl text-surface-900 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-medium">
                            <option value="">-- No Role Assigned (Default) --</option>
                            <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.displayName + ' (' + r.roleName + ')'}">Admin</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 border-t border-surface-200 flex justify-end gap-3">
                    <a href="/admin/users" class="px-5 py-2.5 bg-white border border-surface-200 text-gray-700 font-semibold rounded-xl hover:bg-surface-50 transition-colors text-sm">Cancel</a>
                    <button type="submit" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-md shadow-brand-500/20 transition-colors flex items-center gap-2 text-sm">
                        <i class="bi bi-person-plus-fill"></i> Create User
                    </button>
                </div>
                
            </form>
        </div>
    </div>
</body>
</html>
