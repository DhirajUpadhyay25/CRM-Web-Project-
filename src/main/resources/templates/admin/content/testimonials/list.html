<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/admin-layout :: layout('Testimonial Management', ~{::div})}">
<body>
    <div>
        <div class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-surface-900 mb-1">Testimonial Management</h1>
                <p class="text-gray-500 text-sm">Manage testimonials across the platform.</p>
            </div>
            <button class="bg-brand-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-brand-700 transition-colors">
                <i class="bi bi-plus-lg mr-1.5"></i> Add Testimonial
            </button>
        </div>

        <div class="bg-white rounded-2xl border border-surface-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-surface-50 text-left text-xs text-gray-400 uppercase tracking-wider border-b border-surface-200">
                            <th class="px-6 py-3 font-semibold">ID</th>
                            <th class="px-6 py-3 font-semibold">Details</th>
                            <th class="px-6 py-3 font-semibold">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-surface-100">
                        <tr th:each="item : ${items}" class="hover:bg-surface-50 transition-colors">
                            <td class="px-6 py-4 text-surface-900" th:text="${item.id}">1</td>
                            <td class="px-6 py-4 text-gray-500">Item Details Here</td>
                            <td class="px-6 py-4">
                                <button class="text-brand-600 hover:text-brand-800 text-xs font-semibold mr-3">Edit</button>
                                <button class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>
                            </td>
                        </tr>
                        <tr th:if="${items == null or items.isEmpty()}">
                            <td colspan="3" class="px-6 py-12 text-center text-gray-400">
                                <i class="bi bi-inbox text-3xl mb-2 block"></i>
                                No testimonials found. Use the Data Seeder to add sample data.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
