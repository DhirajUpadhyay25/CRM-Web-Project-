<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/admin-layout :: layout(${isEdit} ? 'Edit FAQ' : 'Create FAQ', ~{::div})}">
<body>
    <div class="max-w-4xl mx-auto space-y-6">

        <!-- Top Header & Back Link -->
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a th:href="@{/admin/faqs}" class="w-9 h-9 rounded-xl bg-surface-100 hover:bg-surface-200 text-gray-700 flex items-center justify-center transition-colors">
                    <i class="bi bi-arrow-left text-lg"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-bold text-surface-900" th:text="${isEdit} ? 'Edit FAQ' : 'Create FAQ'">Create FAQ</h1>
                    <p class="text-xs text-gray-500 mt-0.5">Author or update help center question and detailed answer.</p>
                </div>
            </div>
            
            <a th:href="@{/admin/faqs}" class="px-4 py-2 rounded-xl text-xs font-semibold text-gray-600 bg-surface-100 hover:bg-surface-200 border border-surface-200 transition-colors">
                Cancel
            </a>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-2xl border border-surface-200 shadow-sm overflow-hidden p-6 md:p-8">
            <form th:action="${isEdit} ? @{/admin/faqs/{id}/edit(id=${faq.id})} : @{/admin/faqs/create}" method="post" class="space-y-6">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Question -->
                <div>
                    <label class="block text-sm font-semibold text-surface-900 mb-1.5">Question Title <span class="text-rose-500">*</span></label>
                    <input type="text" name="question" th:value="${faq.question}" required placeholder="e.g. How do I access my enrolled courses?"
                           class="w-full px-4 py-2.5 rounded-xl text-sm bg-surface-50 border border-surface-200 focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition-all"/>
                </div>

                <!-- Answer -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="text-sm font-semibold text-surface-900">Detailed Answer <span class="text-rose-500">*</span></label>
                        <span class="text-xs text-gray-400">Supports HTML formatting tags</span>
                    </div>
                    <textarea name="answer" rows="7" required th:text="${faq.answer}" placeholder="Provide clear, concise step-by-step guidance..."
                              class="w-full px-4 py-3 rounded-xl text-sm bg-surface-50 border border-surface-200 focus:bg-white focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 outline-none transition-all"></textarea>
                </div>

                <!-- Category, Sort Order, Visibility Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-5 pt-2">
                    
                    <!-- Category -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Topic Category</label>
                        <select name="categoryId" class="w-full px-3.5 py-2.5 rounded-xl text-sm bg-surface-50 border border-surface-200 focus:bg-white focus:border-brand-500 outline-none">
                            <option value="">-- Unassigned --</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${faq.faqCategory != null and faq.faqCategory.id == cat.id}">Category</option>
                        </select>
                    </div>

                    <!-- Sort Order -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Display Sort Order</label>
                        <input type="number" name="sortOrder" th:value="${faq.sortOrderSafe}" min="0"
                               class="w-full px-3.5 py-2.5 rounded-xl text-sm bg-surface-50 border border-surface-200 focus:bg-white focus:border-brand-500 outline-none"/>
                    </div>

                    <!-- Visibility -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Audience Visibility</label>
                        <select name="visibility" class="w-full px-3.5 py-2.5 rounded-xl text-sm bg-surface-50 border border-surface-200 focus:bg-white focus:border-brand-500 outline-none">
                            <option th:each="vis : ${visibilities}" th:value="${vis}" th:text="${vis}" th:selected="${faq.visibility == vis}">PUBLIC</option>
                        </select>
                    </div>

                </div>

                <!-- Active Status Toggle -->
                <div class="p-4 rounded-xl bg-surface-50 border border-surface-200 flex items-center justify-between">
                    <div>
                        <span class="text-sm font-semibold text-surface-900 block">Publish to Public Help Center</span>
                        <span class="text-xs text-gray-500">When enabled, this FAQ is actively searchable and visible to users.</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" name="isActive" value="true" th:checked="${faq.isIsActive()}" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                </div>

                <!-- Submit Button -->
                <div class="flex items-center justify-end gap-3 pt-4 border-t border-surface-100">
                    <a th:href="@{/admin/faqs}" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-gray-700 bg-surface-100 hover:bg-surface-200 transition-colors">
                        Cancel
                    </a>
                    <button type="submit" class="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-sm shadow-brand-500/20 transition-all flex items-center gap-1.5">
                        <i class="bi bi-check2-circle text-sm"></i>
                        <span th:text="${isEdit} ? 'Update FAQ' : 'Publish FAQ'">Save FAQ</span>
                    </button>
                </div>

            </form>
        </div>

    </div>
</body>
</html>
