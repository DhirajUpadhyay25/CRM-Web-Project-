<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/admin-layout :: layout('FAQ Categories', ~{::div})}">
<body>
    <div class="space-y-6 max-w-6xl mx-auto">

        <!-- Top Header & Navigation -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center gap-3">
                <a th:href="@{/admin/faqs}" class="w-9 h-9 rounded-xl bg-surface-100 hover:bg-surface-200 text-gray-700 flex items-center justify-center transition-colors">
                    <i class="bi bi-arrow-left text-lg"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-bold text-surface-900 tracking-tight">FAQ Categories</h1>
                    <p class="text-xs text-gray-500 mt-0.5">Manage topic domains, icons, and contextual cross-module tags.</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <a th:href="@{/admin/faqs}" class="px-4 py-2 rounded-xl text-xs font-semibold text-gray-700 bg-surface-100 hover:bg-surface-200 border border-surface-200 transition-colors">
                    <i class="bi bi-patch-question mr-1"></i> Back to FAQs
                </a>
            </div>
        </div>

        <!-- Flash Messages -->
        <div th:if="${success}" class="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 text-sm flex items-center justify-between">
            <span th:text="${success}">Success</span>
            <button type="button" onclick="this.parentElement.remove()" class="text-emerald-500 hover:text-emerald-700 text-xs">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
        <div th:if="${error}" class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-600 text-sm flex items-center justify-between">
            <span th:text="${error}">Error</span>
            <button type="button" onclick="this.parentElement.remove()" class="text-rose-500 hover:text-rose-700 text-xs">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">

            <!-- Left: Add/Edit Category Form (1 col) -->
            <div class="bg-white rounded-2xl border border-surface-200 shadow-sm p-6 space-y-4">
                <div class="flex items-center gap-2 pb-3 border-b border-surface-100">
                    <span class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center text-base">
                        <i class="bi bi-folder-plus"></i>
                    </span>
                    <h2 class="text-sm font-bold text-surface-900 uppercase tracking-wider">Add / Edit Category</h2>
                </div>

                <form th:action="@{/admin/faqs/categories/save}" method="post" class="space-y-4 text-xs">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" id="editCatId" name="id" value=""/>

                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">Category Name <span class="text-rose-500">*</span></label>
                        <input type="text" id="editCatName" name="name" required placeholder="e.g. Placement & Internships"
                               class="w-full px-3 py-2.5 rounded-xl bg-surface-50 border border-surface-200 focus:bg-white focus:border-brand-500 outline-none transition-all"/>
                    </div>

                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">Custom URL Slug (Optional)</label>
                        <input type="text" id="editCatSlug" name="slug" placeholder="e.g. placement-internships"
                               class="w-full px-3 py-2.5 rounded-xl bg-surface-50 border border-surface-200 focus:bg-white focus:border-brand-500 outline-none transition-all font-mono text-[11px]"/>
                    </div>

                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">Icon Class (Bootstrap Icons)</label>
                        <div class="flex items-center gap-2">
                            <input type="text" id="editCatIcon" name="iconClass" value="bi-question-circle" placeholder="e.g. bi-award"
                                   class="w-full px-3 py-2.5 rounded-xl bg-surface-50 border border-surface-200 focus:bg-white focus:border-brand-500 outline-none transition-all"/>
                        </div>
                    </div>

                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">Context Tag</label>
                        <select id="editCatContextTag" name="contextTag" class="w-full px-3 py-2.5 rounded-xl bg-surface-50 border border-surface-200 focus:bg-white focus:border-brand-500 outline-none">
                            <option th:each="tag : ${contextTags}" th:value="${tag}" th:text="${tag}">GENERAL</option>
                        </select>
                    </div>

                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">Display Sort Order</label>
                        <input type="number" id="editCatSort" name="sortOrder" value="0" min="0"
                               class="w-full px-3 py-2.5 rounded-xl bg-surface-50 border border-surface-200 focus:bg-white focus:border-brand-500 outline-none"/>
                    </div>

                    <div>
                        <label class="block font-semibold text-gray-700 mb-1">Description</label>
                        <textarea id="editCatDesc" name="description" rows="3" placeholder="Brief summary of what this category covers..."
                                  class="w-full px-3 py-2.5 rounded-xl bg-surface-50 border border-surface-200 focus:bg-white focus:border-brand-500 outline-none"></textarea>
                    </div>

                    <div class="pt-2">
                        <button type="submit" class="w-full py-2.5 rounded-xl text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-sm transition-all flex items-center justify-center gap-1.5">
                            <i class="bi bi-save2"></i>
                            <span id="catSubmitBtnText">Save Category</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Right: Categories List Table (2 cols) -->
            <div class="lg:col-span-2 bg-white rounded-2xl border border-surface-200 shadow-sm overflow-hidden">
                <div class="p-5 border-b border-surface-100 flex items-center justify-between">
                    <div>
                        <h2 class="text-sm font-bold text-surface-900 uppercase tracking-wider">All Categories</h2>
                        <p class="text-xs text-gray-500 mt-0.5"><span th:text="${categories.size()}">0</span> categories defined in system</p>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-xs text-left">
                        <thead class="bg-surface-50 text-gray-500 uppercase font-semibold border-b border-surface-200">
                            <tr>
                                <th class="px-5 py-3 w-12 text-center">Order</th>
                                <th class="px-5 py-3">Category</th>
                                <th class="px-5 py-3">Context Tag</th>
                                <th class="px-5 py-3">Slug</th>
                                <th class="px-5 py-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-surface-100">
                            <tr th:each="cat : ${categories}" class="hover:bg-surface-50/70 transition-colors">
                                <td class="px-5 py-3.5 text-center">
                                    <span class="inline-flex items-center justify-center w-6 h-6 rounded bg-surface-100 text-gray-700 font-mono font-bold" th:text="${cat.sortOrder}">0</span>
                                </td>
                                <td class="px-5 py-3.5">
                                    <div class="flex items-center gap-2.5">
                                        <span class="w-7 h-7 rounded-lg bg-brand-50 text-brand-600 flex items-center justify-center text-sm">
                                            <i class="bi" th:classappend="${cat.getIconClassSafe()}"></i>
                                        </span>
                                        <div>
                                            <div class="font-bold text-surface-900 text-xs" th:text="${cat.name}">Category Name</div>
                                            <div class="text-[11px] text-gray-400 mt-0.5" th:text="${cat.description}">Description</div>
                                        </div>
                                    </div>
                                </td>
                                <td class="px-5 py-3.5 whitespace-nowrap">
                                    <span class="px-2 py-0.5 rounded bg-surface-100 text-gray-700 font-mono font-bold text-[10px]" th:text="${cat.contextTag}">GENERAL</span>
                                </td>
                                <td class="px-5 py-3.5 font-mono text-gray-500" th:text="${cat.slug}">slug</td>
                                <td class="px-5 py-3.5 text-right whitespace-nowrap">
                                    <div class="flex items-center justify-end gap-1">
                                        <button type="button"
                                                th:data-cat-id="${cat.id}"
                                                th:data-cat-name="${cat.name}"
                                                th:data-cat-slug="${cat.slug}"
                                                th:data-cat-icon="${cat.iconClass}"
                                                th:data-cat-context="${cat.contextTag}"
                                                th:data-cat-sort="${cat.sortOrder}"
                                                th:data-cat-desc="${cat.description}"
                                                onclick="populateEditCategory(this)"
                                                class="p-1.5 rounded-lg text-gray-500 hover:text-brand-600 hover:bg-brand-50 transition-colors"
                                                title="Edit in form">
                                            <i class="bi bi-pencil"></i>
                                        </button>

                                        <form th:action="@{/admin/faqs/categories/{id}/delete(id=${cat.id})}" method="post" class="inline" onsubmit="return confirm('Delete this category? Only empty categories without FAQs can be deleted.');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="p-1.5 rounded-lg text-gray-400 hover:text-rose-600 hover:bg-rose-50 transition-colors" title="Delete Category">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <!-- Client Script -->
    <script>
        function populateEditCategory(btn) {
            document.getElementById('editCatId').value = btn.getAttribute('data-cat-id');
            document.getElementById('editCatName').value = btn.getAttribute('data-cat-name');
            document.getElementById('editCatSlug').value = btn.getAttribute('data-cat-slug');
            document.getElementById('editCatIcon').value = btn.getAttribute('data-cat-icon') || 'bi-question-circle';
            document.getElementById('editCatContextTag').value = btn.getAttribute('data-cat-context') || 'GENERAL';
            document.getElementById('editCatSort').value = btn.getAttribute('data-cat-sort') || 0;
            document.getElementById('editCatDesc').value = btn.getAttribute('data-cat-desc') || '';
            document.getElementById('catSubmitBtnText').innerText = 'Update Category #' + btn.getAttribute('data-cat-id');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
