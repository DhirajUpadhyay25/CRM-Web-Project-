<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/admin-layout :: layout('Audit Logs', ~{::div})}">
<body>
    <div>

        <!-- Header -->
        <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-surface-200 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-surface-900 mb-1">Audit Logs</h1>
                <p class="text-gray-500 text-sm">View system activity and action history.</p>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 flex items-center gap-3">
            <i class="bi bi-check-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-center gap-3">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${errorMsg}"></span>
        </div>

        <!-- Filter Bar -->
        <div class="bg-white rounded-2xl border border-surface-200 shadow-sm overflow-hidden">
            <div class="p-4 border-b border-surface-200 bg-surface-50">
                <form method="get" class="flex flex-col sm:flex-row gap-3">
                    <div class="flex-1 relative">
                        <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="text" name="search" th:value="${search}" placeholder="Search by admin email, entity ID..." class="w-full pl-9 pr-4 py-2 bg-white border border-surface-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
                    </div>
                    <select name="entityType" class="px-3 py-2 bg-white border border-surface-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent">
                        <option value="">All Entity Types</option>
                        <option value="USER" th:selected="${entityTypeFilter == 'USER'}">User</option>
                        <option value="STUDENT" th:selected="${entityTypeFilter == 'STUDENT'}">Student</option>
                        <option value="COURSE" th:selected="${entityTypeFilter == 'COURSE'}">Course</option>
                        <option value="ENROLMENT" th:selected="${entityTypeFilter == 'ENROLMENT'}">Enrolment</option>
                        <option value="ORDER" th:selected="${entityTypeFilter == 'ORDER'}">Order</option>
                        <option value="PAYMENT" th:selected="${entityTypeFilter == 'PAYMENT'}">Payment</option>
                        <option value="LEAD" th:selected="${entityTypeFilter == 'LEAD'}">Lead</option>
                        <option value="ENQUIRY" th:selected="${entityTypeFilter == 'ENQUIRY'}">Enquiry</option>
                        <option value="FOLLOW_UP" th:selected="${entityTypeFilter == 'FOLLOW_UP'}">Follow-up</option>
                        <option value="COUPON" th:selected="${entityTypeFilter == 'COUPON'}">Coupon</option>
                        <option value="ANNOUNCEMENT" th:selected="${entityTypeFilter == 'ANNOUNCEMENT'}">Announcement</option>
                        <option value="SETTINGS" th:selected="${entityTypeFilter == 'SETTINGS'}">Settings</option>
                    </select>
                    <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-medium transition-colors">Filter</button>
                </form>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(auditLogPage.content)}" class="p-12 text-center">
                <div class="w-16 h-16 bg-surface-100 rounded-full flex items-center justify-center text-gray-400 text-2xl mx-auto mb-4">
                    <i class="bi bi-clock-history"></i>
                </div>
                <h3 class="font-semibold text-surface-900 mb-1">No Audit Logs Found</h3>
                <p class="text-sm text-gray-500" th:if="${search or entityTypeFilter}">Try adjusting your search or filter criteria.</p>
                <p class="text-sm text-gray-500" th:unless="${search or entityTypeFilter}">No audit log entries have been recorded yet.</p>
            </div>

            <!-- Table -->
            <div th:if="${!#lists.isEmpty(auditLogPage.content)}" class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-surface-50 border-b border-surface-200 text-gray-500">
                        <tr>
                            <th class="px-6 py-3 font-semibold">Admin Email</th>
                            <th class="px-6 py-3 font-semibold">Action</th>
                            <th class="px-6 py-3 font-semibold">Entity Type</th>
                            <th class="px-6 py-3 font-semibold">Entity ID</th>
                            <th class="px-6 py-3 font-semibold">Details</th>
                            <th class="px-6 py-3 font-semibold">Result</th>
                            <th class="px-6 py-3 font-semibold">Created</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-surface-200">
                        <tr th:each="log : ${auditLogPage.content}" class="hover:bg-surface-50 transition-colors">
                            <td class="px-6 py-4 font-medium text-surface-900" th:text="${log.adminEmail}"></td>
                            <td class="px-6 py-4">
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold"
                                      th:classappend="${log.action == 'CREATE' ? 'bg-green-50 text-green-600' : (log.action == 'UPDATE' ? 'bg-blue-50 text-blue-600' : (log.action == 'DELETE' ? 'bg-red-50 text-red-600' : (log.action == 'LOGIN' ? 'bg-purple-50 text-purple-600' : 'bg-gray-100 text-gray-600')))}"
                                      th:text="${log.action}">—</span>
                            </td>
                            <td class="px-6 py-4 text-gray-500" th:text="${log.entityType}"></td>
                            <td class="px-6 py-4 text-gray-500 font-mono text-xs" th:text="${log.entityId ?: '-'}"></td>
                            <td class="px-6 py-4 text-gray-500 max-w-[200px] truncate" th:text="${log.details}"></td>
                            <td class="px-6 py-4">
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold"
                                      th:classappend="${log.result == 'SUCCESS' ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'}"
                                      th:text="${log.result}">—</span>
                            </td>
                            <td class="px-6 py-4 text-gray-400 text-xs" th:text="${log.createdAt}">—</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:if="${auditLogPage.totalPages > 1}" class="px-6 py-4 border-t border-surface-200 flex flex-col sm:flex-row items-center justify-between bg-surface-50 gap-4">
                <div class="text-sm text-gray-500">
                    Showing <span class="font-medium text-surface-900" th:text="${auditLogPage.number * auditLogPage.size + 1}"></span> to
                    <span class="font-medium text-surface-900" th:text="${auditLogPage.isLast() ? auditLogPage.totalElements : (auditLogPage.number + 1) * auditLogPage.size}"></span> of
                    <span class="font-medium text-surface-900" th:text="${auditLogPage.totalElements}"></span> results
                </div>
                <div class="flex items-center gap-2">
                    <a th:if="${auditLogPage.hasPrevious()}"
                       th:href="@{/admin/audit-logs(page=${auditLogPage.number - 1}, size=${auditLogPage.size}, search=${search}, entityType=${entityTypeFilter})}"
                       class="px-3 py-1.5 rounded-lg bg-white border border-surface-200 text-sm font-medium hover:bg-surface-50 text-surface-700 transition-colors">
                        Previous
                    </a>
                    <a th:if="${auditLogPage.hasNext()}"
                       th:href="@{/admin/audit-logs(page=${auditLogPage.number + 1}, size=${auditLogPage.size}, search=${search}, entityType=${entityTypeFilter})}"
                       class="px-3 py-1.5 rounded-lg bg-white border border-surface-200 text-sm font-medium hover:bg-surface-50 text-surface-700 transition-colors">
                        Next
                    </a>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
