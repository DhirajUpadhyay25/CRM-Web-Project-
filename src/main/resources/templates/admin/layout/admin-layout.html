<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title + ' | EduTake Admin'}">EduTake Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81', 950: '#1e1b4b' },
                        surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface-50 text-surface-900 antialiased flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-surface-950 text-white w-64 flex-shrink-0 flex flex-col h-full transition-transform duration-300 transform -translate-x-full md:translate-x-0 absolute md:relative z-20">
        <!-- Logo Area -->
        <div class="h-16 flex items-center px-6 border-b border-white/10">
            <a href="/admin/dashboard" class="flex items-center gap-2">
                <div class="w-8 h-8 rounded bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center font-bold text-lg shadow-lg">E</div>
                <span class="font-bold text-xl tracking-tight">EduTake<span class="text-brand-400">.</span></span>
            </a>
        </div>
        
        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1 custom-scrollbar">
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 mt-4 px-3">Main</div>
            <a href="/admin/dashboard" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/admin/dashboard">
                <i class="bi bi-grid-1x2-fill"></i>
                <span class="font-medium text-sm">Dashboard</span>
            </a>
            
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 mt-6 px-3">Learning</div>
            <a href="/admin/courses" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/admin/courses">
                <i class="bi bi-play-btn-fill"></i>
                <span class="font-medium text-sm">Courses</span>
            </a>
            <a href="/admin/categories" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/admin/categories">
                <i class="bi bi-collection-fill"></i>
                <span class="font-medium text-sm">Categories</span>
            </a>
            
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 mt-6 px-3">CRM & Users</div>
            <a href="/admin/students" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/admin/students">
                <i class="bi bi-mortarboard-fill"></i>
                <span class="font-medium text-sm">Students</span>
            </a>
            <a href="/admin/users" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/admin/users">
                <i class="bi bi-people-fill"></i>
                <span class="font-medium text-sm">Platform Users</span>
            </a>
            
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 mt-6 px-3">Communication</div>
            <a href="/admin/feedback" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/admin/feedback">
                <i class="bi bi-chat-quote-fill"></i>
                <span class="font-medium text-sm">Feedback</span>
            </a>
            
            <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 mt-6 px-3">System</div>
            <a href="/adminProfile" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/adminProfile">
                <i class="bi bi-person-badge-fill"></i>
                <span class="font-medium text-sm">Legacy Profile</span>
            </a>
        </nav>
        
        <!-- Bottom User Area -->
        <div class="p-4 border-t border-white/10">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-brand-600 flex items-center justify-center font-bold">A</div>
                <div>
                    <p class="text-sm font-semibold text-white">Administrator</p>
                    <p class="text-xs text-brand-400">Admin Control</p>
                </div>
            </div>
            <a href="/logout" class="flex items-center justify-center gap-2 w-full py-2 bg-red-500/10 text-red-400 rounded-lg hover:bg-red-500/20 transition-colors font-medium text-sm">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col h-full overflow-hidden bg-surface-50">
        
        <!-- Navbar -->
        <header class="h-16 bg-white border-b border-surface-200 flex items-center justify-between px-6 z-10 shadow-sm shrink-0">
            <div class="flex items-center gap-4 flex-1">
                <button id="sidebarToggle" class="md:hidden text-gray-500 hover:text-brand-600 transition-colors text-xl">
                    <i class="bi bi-list"></i>
                </button>
                <div class="hidden sm:flex items-center text-sm font-medium text-gray-500 gap-2">
                    <span class="text-brand-600">Admin Control Center</span>
                </div>
                
                <!-- Search Bar -->
                <div class="hidden md:flex ml-6 relative max-w-md w-full">
                    <i class="bi bi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Search across platform..." class="w-full bg-surface-100 border-none rounded-xl py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-brand-500/50 outline-none transition-all placeholder-gray-500 text-surface-900">
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Notifications -->
                <button class="relative w-10 h-10 rounded-full bg-surface-100 flex items-center justify-center text-gray-600 hover:text-brand-600 hover:bg-brand-50 transition-colors">
                    <i class="bi bi-bell"></i>
                    <span class="absolute top-2 right-2.5 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
                </button>
                
                <!-- Profile -->
                <div class="w-10 h-10 rounded-full bg-brand-100 flex items-center justify-center text-brand-700 font-bold border border-brand-200 cursor-pointer shadow-sm">
                    A
                </div>
            </div>
        </header>

        <!-- Main Scrolling Content -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <!-- Flash Messages -->
            <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 flex items-start gap-3 shadow-sm animate-fade-in">
                <i class="bi bi-check-circle-fill text-green-500 mt-0.5"></i>
                <p class="font-medium text-sm" th:text="${successMsg}"></p>
            </div>
            <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-start gap-3 shadow-sm animate-fade-in">
                <i class="bi bi-exclamation-triangle-fill text-red-500 mt-0.5"></i>
                <p class="font-medium text-sm" th:text="${errorMsg}"></p>
            </div>
            
            <!-- Dynamic Content -->
            <div th:replace="${content}"></div>
            
        </main>
        
        <!-- Mobile Sidebar Overlay -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-surface-900/50 backdrop-blur-sm z-10 hidden md:hidden"></div>
    </div>

    <!-- Scripts -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                sidebarOverlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarOverlay.classList.add('hidden');
            }
        }

        sidebarToggle.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', toggleSidebar);

        // Active link highlighting
        const currentPath = window.location.pathname;
        const links = document.querySelectorAll('.sidebar-link');
        links.forEach(link => {
            const path = link.getAttribute('data-path');
            if (currentPath === path || (currentPath.startsWith(path) && path !== '/admin/dashboard')) {
                link.classList.add('bg-brand-600/20', 'text-brand-400');
                link.classList.remove('text-gray-300');
            }
        });
    </script>
</body>
</html>
