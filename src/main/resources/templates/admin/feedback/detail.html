<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout/admin-layout :: layout('Feedback Detail', ~{::div})}">
<body>
    <div>
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-5 border-b border-surface-200">
            <div>
                <div class="flex items-center gap-3 mb-1">
                    <a href="/admin/feedback" class="text-gray-400 hover:text-brand-600 transition-colors">
                        <i class="bi bi-arrow-left text-lg"></i>
                    </a>
                    <h1 class="text-2xl font-bold text-surface-900">Feedback #<span th:text="${feedback.id}"></span></h1>
                </div>
                <p class="text-gray-500 text-sm ml-8">Submitted <span th:text="${feedback.createdAt != null ? #temporals.format(feedback.createdAt, 'dd MMMM yyyy \'at\' HH:mm') : '-'}"></span></p>
            </div>
            <div class="flex items-center gap-2 ml-8 sm:ml-0">
                <a href="#respond"
                   class="inline-flex items-center gap-1.5 px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-sm font-semibold shadow-sm transition-all">
                    <i class="bi bi-reply"></i> Respond
                </a>
                <a href="/admin/feedback"
                   class="inline-flex items-center gap-1.5 px-4 py-2 bg-white border border-surface-300 rounded-xl text-sm font-semibold text-gray-700 hover:bg-surface-50 transition-colors">
                    <i class="bi bi-arrow-left"></i> Back
                </a>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-700 flex items-center gap-3">
            <i class="bi bi-check-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${successMsg}"></span>
        </div>
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 flex items-center gap-3">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span class="text-sm font-medium" th:text="${errorMsg}"></span>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Main Content -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Feedback Details -->
                <div class="bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-surface-200 bg-surface-50 flex items-center justify-between">
                        <h2 class="font-bold text-surface-900">Feedback Details</h2>
                        <span th:text="${feedback.status != null ? feedback.status.displayName : 'New'}"
                              th:classappend="${feedback.status != null ? feedback.status.badgeClass : 'bg-blue-100 text-blue-700'}"
                              class="px-2.5 py-1 rounded-full text-xs font-semibold"></span>
                    </div>
                    <div class="p-6 space-y-4">
                        <!-- Student Info -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Student</p>
                                <p class="text-surface-900 font-medium" th:text="${feedback.displayName}"></p>
                                <p class="text-gray-500 text-xs" th:unless="${feedback.anonymous}" th:text="${feedback.studentEmail}"></p>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Course</p>
                                <p class="text-surface-900 font-medium" th:text="${feedback.course != null ? feedback.course.name : 'General'}"></p>
                                <p class="text-gray-500 text-xs" th:if="${feedback.instructor != null}" th:text="'Instructor: ' + ${feedback.instructor.name}"></p>
                            </div>
                        </div>

                        <!-- Rating -->
                        <div>
                            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Rating</p>
                            <div class="flex items-center gap-1">
                                <template th:each="i : ${#numbers.sequence(1,5)}">
                                    <i th:if="${i <= (feedback.rating != null ? feedback.rating : 0)}" class="bi bi-star-fill text-amber-400 text-lg"></i>
                                    <i th:unless="${i <= (feedback.rating != null ? feedback.rating : 0)}" class="bi bi-star text-gray-300 text-lg"></i>
                                </template>
                                <span class="text-sm text-gray-500 ml-2" th:text="'(' + ${feedback.rating} + '/5)'"></span>
                            </div>
                        </div>

                        <!-- Category & Subject -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Category</p>
                                <span th:if="${feedback.category != null}" th:text="${feedback.category}"
                                      class="px-2.5 py-1 bg-surface-100 rounded-full text-xs font-semibold text-surface-700 inline-block"></span>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Type</p>
                                <span th:if="${feedback.feedbackType != null}" th:text="${feedback.feedbackType.displayName}"
                                      class="px-2.5 py-1 bg-surface-100 rounded-full text-xs font-semibold text-surface-700 inline-block"></span>
                            </div>
                        </div>

                        <!-- Subject -->
                        <div th:if="${feedback.subject != null}">
                            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Subject</p>
                            <p class="text-surface-900 font-medium" th:text="${feedback.subject}"></p>
                        </div>

                        <!-- Message -->
                        <div>
                            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Message</p>
                            <div class="bg-surface-50 p-4 rounded-xl border border-surface-200 text-surface-900 text-sm whitespace-pre-wrap" th:text="${feedback.message}"></div>
                        </div>
                    </div>
                </div>

                <!-- Responses -->
                <div class="bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-surface-200 bg-surface-50">
                        <h2 class="font-bold text-surface-900">Responses</h2>
                    </div>

                    <div th:if="${responses != null and !responses.isEmpty()}" class="p-6 space-y-4">
                        <div th:each="resp : ${responses}" class="border-l-4 pl-4 py-2"
                             th:classappend="${resp.responderRole == 'ADMIN' ? 'border-purple-500' : resp.responderRole == 'INSTRUCTOR' ? 'border-blue-500' : 'border-green-500'}">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-semibold text-sm text-surface-900" th:text="${resp.responderName != null ? resp.responderName : resp.responderEmail}"></span>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold"
                                      th:classappend="${resp.responderRole == 'ADMIN' ? 'bg-purple-100 text-purple-700' : resp.responderRole == 'INSTRUCTOR' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}"
                                      th:text="${resp.responderRole}"></span>
                                <span class="text-xs text-gray-400" th:text="${resp.createdAt != null ? #temporals.format(resp.createdAt, 'dd MMM yyyy, HH:mm') : ''}"></span>
                            </div>
                            <p class="text-sm text-surface-800 whitespace-pre-wrap" th:text="${resp.message}"></p>
                        </div>
                    </div>

                    <div th:unless="${responses != null and !responses.isEmpty()}" class="p-6 text-center text-sm text-gray-400">
                        No responses yet.
                    </div>

                    <!-- Respond Form -->
                    <div id="respond" class="px-6 py-4 border-t border-surface-200 bg-surface-50">
                        <form th:action="@{/admin/feedback/{id}/respond(id=${feedback.id})}" method="post">
                            <div class="mb-3">
                                <label class="block text-sm font-semibold text-surface-800 mb-1.5">Your Response</label>
                                <textarea name="message" rows="3" required minlength="5" maxlength="2000"
                                          placeholder="Write your response to the student..."
                                          class="w-full px-4 py-2.5 bg-white border border-surface-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all resize-none"></textarea>
                            </div>
                            <div class="flex justify-end">
                                <button type="submit"
                                        class="px-6 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-semibold text-sm shadow-sm transition-all">
                                    <i class="bi bi-reply"></i> Submit Response
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Status History -->
                <div th:if="${history != null and !history.isEmpty()}" class="bg-white border border-surface-200 rounded-2xl shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-surface-200 bg-surface-50">
                        <h2 class="font-bold text-surface-900">Activity History</h2>
                    </div>
                    <div class="p-6">
                        <div class="space-y-3">
                            <div th:each="h : ${history}" class="flex items-start gap-3 text-sm">
                                <div class="w-2 h-2 rounded-full bg-brand-500 mt-1.5 flex-shrink-0"></div>
                                <div>
                                    <p class="text-surface-800">
                                        <span class="font-medium" th:text="${h.changedBy}"></span>
                                        changed status from
                                        <span th:if="${h.fromStatus != null}" class="font-medium" th:text="${h.fromStatus}"></span>
                                        <span th:unless="${h.fromStatus != null}" class="font-medium text-gray-400">-</span>
                                        to <span class="font-medium" th:text="${h.toStatus}"></span>
                                    </p>
                                    <p th:if="${h.reason != null}" class="text-gray-500 text-xs mt-0.5" th:text="${h.reason}"></p>
                                    <p class="text-gray-400 text-xs" th:text="${h.createdAt != null ? #temporals.format(h.createdAt, 'dd MMM yyyy, HH:mm') : ''}"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="space-y-6">
                <!-- Status Actions -->
                <div class="bg-white border border-surface-200 rounded-2xl shadow-sm p-6">
                    <h3 class="font-bold text-surface-900 mb-4">Status Actions</h3>
                    <div class="space-y-2">
                        <form th:action="@{/admin/feedback/{id}/status(id=${feedback.id})}" method="post" class="space-y-2">
                            <select name="status" class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
                                <option th:each="s : ${feedbackStatuses}" th:value="${s}" th:text="${s.displayName}" th:selected="${feedback.status == s}"></option>
                            </select>
                            <input type="text" name="reason" placeholder="Reason (optional)" class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none">
                            <button type="submit" class="w-full px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-sm font-semibold transition-colors">
                                Update Status
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Assign -->
                <div class="bg-white border border-surface-200 rounded-2xl shadow-sm p-6">
                    <h3 class="font-bold text-surface-900 mb-4">Assign To</h3>
                    <form th:action="@{/admin/feedback/{id}/assign(id=${feedback.id})}" method="post">
                        <input type="email" name="adminEmail" th:value="${feedback.assignedAdminEmail}"
                               placeholder="Admin email"
                               class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none mb-2">
                        <button type="submit" class="w-full px-4 py-2 bg-surface-100 text-surface-700 rounded-lg text-sm font-semibold hover:bg-surface-200 transition-colors">
                            <i class="bi bi-person-plus"></i> Assign
                        </button>
                    </form>
                </div>

                <!-- Internal Notes -->
                <div class="bg-white border border-surface-200 rounded-2xl shadow-sm p-6">
                    <h3 class="font-bold text-surface-900 mb-4">Internal Notes</h3>
                    <div th:if="${notes != null and !notes.isEmpty()}" class="space-y-3 mb-4">
                        <div th:each="note : ${notes}" class="bg-yellow-50 border border-yellow-200 rounded-lg p-3">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-xs font-semibold text-surface-800" th:text="${note.adminName != null ? note.adminName : note.adminEmail}"></span>
                                <span class="text-[10px] text-gray-400" th:text="${note.createdAt != null ? #temporals.format(note.createdAt, 'dd MMM, HH:mm') : ''}"></span>
                            </div>
                            <p class="text-xs text-surface-800" th:text="${note.note}"></p>
                        </div>
                    </div>
                    <form th:action="@{/admin/feedback/{id}/note(id=${feedback.id})}" method="post">
                        <textarea name="note" rows="2" required placeholder="Add internal note..."
                                  class="w-full px-3 py-2 bg-surface-50 border border-surface-200 rounded-lg text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none resize-none mb-2"></textarea>
                        <button type="submit" class="w-full px-4 py-2 bg-yellow-50 text-yellow-700 rounded-lg text-sm font-semibold hover:bg-yellow-100 transition-colors">
                            <i class="bi bi-sticky"></i> Add Note
                        </button>
                    </form>
                </div>

                <!-- Details -->
                <div class="bg-white border border-surface-200 rounded-2xl shadow-sm p-6">
                    <h3 class="font-bold text-surface-900 mb-4">Details</h3>
                    <div class="space-y-3 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-500">Priority</span>
                            <span th:text="${feedback.priority != null ? feedback.priority.displayName : 'Medium'}"
                                  th:classappend="${feedback.priority != null ? feedback.priority.badgeClass : 'bg-gray-100 text-gray-600'}"
                                  class="px-2 py-0.5 rounded-full text-[10px] font-semibold"></span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Submitted</span>
                            <span class="text-surface-800 font-medium" th:text="${feedback.createdAt != null ? #temporals.format(feedback.createdAt, 'dd MMM yyyy') : '-'}"></span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-500">Updated</span>
                            <span class="text-surface-800 font-medium" th:text="${feedback.updatedAt != null ? #temporals.format(feedback.updatedAt, 'dd MMM yyyy') : '-'}"></span>
                        </div>
                        <div th:if="${feedback.resolvedAt != null}" class="flex justify-between">
                            <span class="text-gray-500">Resolved</span>
                            <span class="text-surface-800 font-medium" th:text="${#temporals.format(feedback.resolvedAt, 'dd MMM yyyy')}"></span>
                        </div>
                    </div>
                </div>

                <!-- Danger Zone -->
                <div class="bg-white border border-red-200 rounded-2xl shadow-sm p-6">
                    <h3 class="font-bold text-red-600 mb-4">Danger Zone</h3>
                    <form th:action="@{/admin/feedback/{id}/delete(id=${feedback.id})}" method="post"
                          onsubmit="return confirm('Are you sure you want to archive this feedback?');">
                        <button type="submit" class="w-full px-4 py-2 bg-red-50 text-red-600 rounded-lg text-sm font-semibold hover:bg-red-100 transition-colors">
                            <i class="bi bi-archive"></i> Archive Feedback
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
