<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/base-head :: head('Course Management | Admin')}"></head>

<body class="bg-surface-950 text-white antialiased min-h-screen flex flex-col">

    <!-- Navbar -->
    <div th:replace="~{fragments/tw-navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col mt-16 pt-8 pb-24 relative overflow-hidden">
        
        <!-- Background Elements -->
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-brand-600/5 rounded-full blur-[150px] pointer-events-none"></div>

        <div class="container mx-auto px-4 max-w-7xl relative z-10">
            
            <!-- Header Section -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <h1 class="text-3xl font-bold tracking-tight mb-2">Course Management</h1>
                    <p class="text-gray-400">Manage courses, products, and programs across the platform.</p>
                </div>
                <div class="flex items-center gap-3">
                    <a href="/categories" class="px-5 py-2.5 bg-surface-800 hover:bg-surface-700 text-white font-medium rounded-xl transition-all border border-white/10 flex items-center gap-2">
                        <i class="bi bi-tags"></i> Categories
                    </a>
                    <a href="/addCourse" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl transition-all shadow-lg shadow-brand-600/20 flex items-center gap-2">
                        <i class="bi bi-plus-lg"></i> Add New Course
                    </a>
                </div>
            </div>

            <!-- Alerts -->
            <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-green-500/10 border border-green-500/20 text-green-400 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${successMsg}"></span>
                </div>
            </div>
            <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 flex items-center gap-3">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${errorMsg}"></span>
            </div>

            <!-- Filters & Search Bar -->
            <div class="bg-surface-900 border border-white/10 rounded-2xl p-4 mb-6 shadow-lg">
                <form action="/courseManagement" method="get" class="flex flex-col md:flex-row gap-4 items-center">
                    
                    <!-- Search Input -->
                    <div class="relative flex-1 w-full">
                        <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search courses by title or slug..." 
                               class="w-full pl-11 pr-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                    </div>

                    <!-- Category Filter -->
                    <div class="w-full md:w-48">
                        <select name="categoryId" class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50 appearance-none">
                            <option value="">All Categories</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${categoryId == cat.id}"></option>
                        </select>
                    </div>

                    <!-- Status Filter -->
                    <div class="w-full md:w-48">
                        <select name="status" class="w-full px-4 py-2.5 bg-surface-950/50 border border-white/10 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-brand-500/50 appearance-none">
                            <option value="">All Statuses</option>
                            <option value="DRAFT" th:selected="${status != null and status.name() == 'DRAFT'}">Draft</option>
                            <option value="PUBLISHED" th:selected="${status != null and status.name() == 'PUBLISHED'}">Published</option>
                            <option value="ARCHIVED" th:selected="${status != null and status.name() == 'ARCHIVED'}">Archived</option>
                        </select>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="w-full md:w-auto px-6 py-2.5 bg-surface-800 hover:bg-surface-700 text-white font-medium rounded-xl transition-all border border-white/10">
                        Filter
                    </button>
                    
                    <!-- Clear Button -->
                    <a th:if="${keyword != null or status != null or categoryId != null}" href="/courseManagement" class="text-gray-400 hover:text-white transition-colors text-sm px-2">
                        Clear
                    </a>
                </form>
            </div>

            <!-- Data Table -->
            <div class="bg-surface-900 border border-white/10 rounded-2xl shadow-xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse whitespace-nowrap">
                        <thead>
                            <tr class="bg-surface-800/50 border-b border-white/5">
                                <th class="py-4 px-6 text-xs font-semibold text-gray-400 uppercase tracking-wider">Course</th>
                                <th class="py-4 px-6 text-xs font-semibold text-gray-400 uppercase tracking-wider">Category</th>
                                <th class="py-4 px-6 text-xs font-semibold text-gray-400 uppercase tracking-wider">Price</th>
                                <th class="py-4 px-6 text-xs font-semibold text-gray-400 uppercase tracking-wider">Status</th>
                                <th class="py-4 px-6 text-xs font-semibold text-gray-400 uppercase tracking-wider">Featured</th>
                                <th class="py-4 px-6 text-xs font-semibold text-gray-400 uppercase tracking-wider text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-white/5">
                            
                            <!-- Empty State -->
                            <tr th:if="${#lists.isEmpty(coursesPage.content)}">
                                <td colspan="6" class="py-12 text-center">
                                    <i class="bi bi-inbox text-4xl text-gray-600 mb-3 block"></i>
                                    <h3 class="text-lg font-bold text-white mb-1">No courses found</h3>
                                    <p class="text-gray-400 text-sm">Try adjusting your search or filters.</p>
                                </td>
                            </tr>

                            <!-- Rows -->
                            <tr th:each="course : ${coursesPage.content}" class="hover:bg-white/5 transition-colors group">
                                <td class="py-4 px-6">
                                    <div class="flex items-center gap-4">
                                        <div class="w-12 h-12 rounded-lg overflow-hidden bg-surface-800 flex-shrink-0 border border-white/10">
                                            <img th:if="${course.imageUrl}" th:src="@{${course.imageUrl}}" class="w-full h-full object-cover" alt="Thumb">
                                            <i th:unless="${course.imageUrl}" class="bi bi-image text-gray-500 text-xl flex items-center justify-center h-full"></i>
                                        </div>
                                        <div>
                                            <div class="font-bold text-white mb-0.5" th:text="${course.name}"></div>
                                            <div class="text-xs text-brand-400 font-mono" th:text="${course.slug}"></div>
                                        </div>
                                    </div>
                                </td>
                                <td class="py-4 px-6 text-sm text-gray-300">
                                    <span th:if="${course.category}" th:text="${course.category.name}"></span>
                                    <span th:unless="${course.category}" class="text-gray-600 italic">Uncategorized</span>
                                </td>
                                <td class="py-4 px-6">
                                    <div class="font-medium text-white" th:text="${'₹' + (course.discountedPrice != null ? course.discountedPrice : course.originalPrice)}"></div>
                                    <div th:if="${course.discountedPrice != null}" class="text-xs text-gray-500 line-through" th:text="${'₹' + course.originalPrice}"></div>
                                </td>
                                <td class="py-4 px-6">
                                    <span th:if="${course.status.name() == 'PUBLISHED'}" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-green-500/10 text-green-400 border border-green-500/20">
                                        <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span> Published
                                    </span>
                                    <span th:if="${course.status.name() == 'DRAFT'}" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">
                                        <span class="w-1.5 h-1.5 rounded-full bg-yellow-400"></span> Draft
                                    </span>
                                    <span th:if="${course.status.name() == 'ARCHIVED'}" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-gray-500/10 text-gray-400 border border-gray-500/20">
                                        <i class="bi bi-archive"></i> Archived
                                    </span>
                                </td>
                                <td class="py-4 px-6">
                                    <i th:if="${course.featured}" class="bi bi-star-fill text-yellow-400"></i>
                                    <i th:unless="${course.featured}" class="bi bi-star text-gray-600"></i>
                                </td>
                                <td class="py-4 px-6 text-right">
                                    <div class="flex items-center justify-end gap-2">
                                        <a th:href="@{/courses/{slug}(slug=${course.slug})}" target="_blank" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-surface-800 transition-colors" title="View Public Page">
                                            <i class="bi bi-box-arrow-up-right"></i>
                                        </a>
                                        <a th:href="@{/editCourse(id=${course.id})}" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:text-brand-400 hover:bg-brand-500/10 transition-colors" title="Edit">
                                            <i class="bi bi-pencil-square"></i>
                                        </a>
                                        <a th:href="@{/deleteCourseDetails(id=${course.id})}" onclick="return confirm('Are you sure you want to permanently delete this course? It is recommended to Archive it instead.')" class="w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:text-red-400 hover:bg-red-500/10 transition-colors" title="Delete">
                                            <i class="bi bi-trash3"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div th:if="${coursesPage.totalPages > 1}" class="px-6 py-4 border-t border-white/5 flex items-center justify-between bg-surface-900/50">
                    <div class="text-sm text-gray-400">
                        Showing <span class="font-medium text-white" th:text="${coursesPage.number * coursesPage.size + 1}"></span> to 
                        <span class="font-medium text-white" th:text="${coursesPage.isLast() ? coursesPage.totalElements : (coursesPage.number + 1) * coursesPage.size}"></span> of 
                        <span class="font-medium text-white" th:text="${coursesPage.totalElements}"></span> results
                    </div>
                    <div class="flex items-center gap-2">
                        <a th:if="${coursesPage.hasPrevious()}" 
                           th:href="@{/courseManagement(page=${coursesPage.number - 1}, size=${coursesPage.size}, keyword=${keyword}, status=${status}, categoryId=${categoryId})}"
                           class="px-3 py-1.5 rounded-lg bg-surface-800 border border-white/10 text-sm hover:bg-surface-700 transition-colors">
                            Previous
                        </a>
                        <a th:if="${coursesPage.hasNext()}" 
                           th:href="@{/courseManagement(page=${coursesPage.number + 1}, size=${coursesPage.size}, keyword=${keyword}, status=${status}, categoryId=${categoryId})}"
                           class="px-3 py-1.5 rounded-lg bg-surface-800 border border-white/10 text-sm hover:bg-surface-700 transition-colors">
                            Next
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/tw-footer :: footer}"></div>

</body>
</html>
