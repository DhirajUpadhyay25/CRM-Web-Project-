<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<div th:fragment="frg-student-sidebar">
    
    <!-- Dashboard -->
    <a href="/student/dashboard" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/student/dashboard">
        <i class="bi bi-grid-1x2-fill text-base"></i>
        <span class="font-medium text-sm">Dashboard</span>
    </a>
    
    <!-- My Courses -->
    <a href="/myCourses" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/myCourses">
        <i class="bi bi-play-btn-fill text-base"></i>
        <span class="font-medium text-sm">My Courses</span>
    </a>
    
    <!-- Orders -->
    <a href="/student/orders" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/student/orders">
        <i class="bi bi-bag-check-fill text-base"></i>
        <span class="font-medium text-sm">Orders</span>
    </a>
    
    <!-- Notifications -->
    <a href="/student/notifications" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/student/notifications">
        <i class="bi bi-bell-fill text-base"></i>
        <span class="font-medium text-sm">Notifications</span>
    </a>

    <!-- Divider -->
    <div class="my-3 border-t border-white/10"></div>
    
    <!-- Profile -->
    <a href="/userProfile" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/userProfile">
        <i class="bi bi-person-fill text-base"></i>
        <span class="font-medium text-sm">Profile</span>
    </a>
    
    <!-- Feedback -->
    <a href="/provideFeedback" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-300 hover:text-white" data-path="/provideFeedback">
        <i class="bi bi-chat-quote-fill text-base"></i>
        <span class="font-medium text-sm">Feedback</span>
    </a>

    <!-- Divider -->
    <div class="my-3 border-t border-white/10"></div>
    
    <!-- Browse Courses -->
    <a href="/courses" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-400 hover:text-white" data-path="/courses">
        <i class="bi bi-compass text-base"></i>
        <span class="font-medium text-sm">Browse Courses</span>
    </a>
    
    <!-- Home -->
    <a href="/index" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition-colors text-gray-400 hover:text-white">
        <i class="bi bi-house-fill text-base"></i>
        <span class="font-medium text-sm">Back to Home</span>
    </a>
    
</div>
</body>
</html>
