<header th:fragment="u-header">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark  shadow"
        style="padding:1px; z-index: 1000;">

        <div class="container">

            <!-- Brand -->
            <a class="navbar-brand fw-bold fs-3"
                href="/index"
                style="letter-spacing: 1px;">
               EduTake
            </a>

            <!-- Mobile Toggle -->
            <button class="navbar-toggler border-0"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Navbar Content -->
            <div class="collapse navbar-collapse"
                id="navbarSupportedContent">

                <ul class="navbar-nav ms-auto align-items-lg-center text-center"
                    style="gap: 15px;">

                    <!-- Home -->
                    <li class="nav-item">
                        <a class="nav-link active"
                            href="/index"
                            style="
                                color: white;
                                font-weight: 500;
                                transition: 0.3s;
                                padding: 8px 16px;
                                border-radius: 8px;
                            "

                            onmouseover="this.style.backgroundColor='#0d6efd'"
                            onmouseout="this.style.backgroundColor='transparent'">

                            Home

                        </a>
                    </li>

                    <!-- My Courses -->
                    <li class="nav-item">
                        <a class="nav-link"
                            href="/myCourses"

                            style="
                                color: white;
                                font-weight: 500;
                                transition: 0.3s;
                                padding: 8px 16px;
                                border-radius: 8px;
                            "

                            onmouseover="this.style.backgroundColor='#0d6efd'"
                            onmouseout="this.style.backgroundColor='transparent'">

                            My Courses

                        </a>
                    </li>

                    <!-- Feedback -->
                    <li class="nav-item">
                        <a class="nav-link"
                            href="/provideFeedback"

                            style="
                                color: white;
                                font-weight: 500;
                                transition: 0.3s;
                                padding: 8px 16px;
                                border-radius: 8px;
                            "

                            onmouseover="this.style.backgroundColor='#0d6efd'"
                            onmouseout="this.style.backgroundColor='transparent'">

                            Feedback

                        </a>
                    </li>

                    <!-- Profile -->
                    <li class="nav-item">

                        <a class="nav-link d-flex align-items-center justify-content-center gap-2"
                            href="/userProfile"

                            style="
                                color: white;
                                font-weight: 500;
                                padding: 8px 16px;
                                border-radius: 8px;
                                transition: 0.3s;
                            "

                            onmouseover="this.style.backgroundColor='#0d6efd'"
                            onmouseout="this.style.backgroundColor='transparent'">

                            <i class="bi bi-person-circle"
                                style="font-size: 1.7rem;"></i>

                            <span>

                                Hello,
                                <span style="font-weight: bold;"
                                    th:text="${sessionUser.name}">
                                </span>

                            </span>

                        </a>

                    </li>

                    <!-- Logout -->
                    <li class="nav-item">

                        <a href="/logout"
                            class="btn btn-danger"

                            style="
                                padding: 8px 18px;
                                font-weight: 500;
                                border-radius: 8px;">
                            Logout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
<!-- Body Padding for Fixed Navbar -->
<div style="margin-top: 90px;"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
