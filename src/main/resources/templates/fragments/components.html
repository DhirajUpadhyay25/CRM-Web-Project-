<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════
     COURSE CARD COMPONENT
     ═══════════════════════════════════════════════════════════════════ -->
<div th:fragment="course-card(course)" class="group flex flex-col bg-surface-900 border border-white/5 rounded-2xl overflow-hidden hover:border-brand-500/30 transition-all hover:-translate-y-1 hover:shadow-xl hover:shadow-brand-500/10">
    <!-- Thumbnail Area -->
    <div class="relative h-48 overflow-hidden bg-surface-800">
        <img th:src="@{${course.imageUrl}}" th:alt="${course.name}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://via.placeholder.com/800x600.png?text=Course+Image'">
        <div class="absolute top-4 left-4">
            <span class="px-2.5 py-1 text-xs font-semibold text-brand-300 bg-brand-500/20 backdrop-blur-md rounded-full border border-brand-500/20">
                Course
            </span>
        </div>
    </div>
    
    <!-- Content Area -->
    <div class="p-6 flex flex-col flex-grow">
        <!-- Title & Description -->
        <h3 class="text-lg font-bold text-white mb-2 line-clamp-2 group-hover:text-brand-400 transition-colors" th:text="${course.name}">Course Title</h3>
        <p class="text-sm text-gray-400 mb-6 line-clamp-2 flex-grow" th:text="${course.description}">Course Description</p>
        
        <!-- Metadata -->
        <div class="flex items-center gap-4 text-xs text-gray-500 mb-6">
            <div class="flex items-center gap-1.5">
                <i class="bi bi-clock"></i>
                <span>Self-paced</span>
            </div>
            <div class="flex items-center gap-1.5">
                <i class="bi bi-bar-chart"></i>
                <span>All Levels</span>
            </div>
        </div>
        
        <!-- Footer: Price & CTA -->
        <div class="mt-auto pt-4 border-t border-white/5 flex items-center justify-between">
            <div>
                <div class="text-xs text-gray-500 line-through mb-0.5" th:if="${course.originalPrice != null and course.originalPrice != course.discountedPrice}">
                    ₹<span th:text="${course.originalPrice}">0</span>
                </div>
                <div class="text-lg font-bold text-white">
                    ₹<span th:text="${course.discountedPrice}">0</span>
                </div>
            </div>
            <a th:href="@{'/courses/' + ${course.id}}" class="px-4 py-2 bg-white/5 hover:bg-brand-600 text-white text-sm font-medium rounded-lg transition-all border border-white/10 hover:border-brand-500">
                View Details
            </a>
        </div>
    </div>
</div>

</body>
</html>
