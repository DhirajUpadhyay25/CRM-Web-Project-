<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<!-- ═══════════════════════════════════════════════════════════════════
     UNIFIED NAVBAR — Adapts based on Spring Security Roles
     ═══════════════════════════════════════════════════════════════════ -->
<header th:fragment="navbar">
    <nav class="fixed top-0 left-0 right-0 z-50 bg-surface-950/90 backdrop-blur-xl border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">

                <!-- Brand -->
                <a href="/index" class="flex items-center gap-2 group">
                    <div class="w-8 h-8 bg-gradient-to-br from-brand-500 to-brand-700 rounded-lg flex items-center justify-center">
                        <span class="text-white font-bold text-sm">E</span>
                    </div>
                    <span class="text-white font-bold text-xl tracking-tight group-hover:text-brand-400 transition-colors">EduTake</span>
                </a>

                <!-- Desktop Nav -->
                <div class="hidden md:flex items-center gap-1">
                    <a href="/index" class="px-4 py-2 text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 rounded-lg transition-all">Home</a>
                    <a href="/index#courses" class="px-4 py-2 text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 rounded-lg transition-all">Courses</a>
                    
                    <!-- Student specific -->
                    <a sec:authorize="hasRole('STUDENT')" href="/myCourses" class="px-4 py-2 text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 rounded-lg transition-all">My Courses</a>
                    <a sec:authorize="hasRole('STUDENT')" href="/provideFeedback" class="px-4 py-2 text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 rounded-lg transition-all">Feedback</a>

                    <!-- Admin specific -->
                    <a sec:authorize="hasRole('ADMIN')" href="/adminProfile" class="px-4 py-2 text-sm font-medium text-amber-400 hover:text-amber-300 hover:bg-white/5 rounded-lg transition-all">Admin Dashboard</a>
                    
                    <!-- Employee specific -->
                    <a sec:authorize="hasRole('EMPLOYEE')" href="/employeeProfile" class="px-4 py-2 text-sm font-medium text-blue-400 hover:text-blue-300 hover:bg-white/5 rounded-lg transition-all">Employee Portal</a>
                </div>

                <!-- Auth Buttons / User Profile -->
                <div class="hidden md:flex items-center gap-4">
                    <!-- Unauthenticated -->
                    <div sec:authorize="!isAuthenticated()" class="flex items-center gap-3">
                        <a href="/login"
                           class="px-5 py-2 text-sm font-semibold text-gray-300 border border-white/10 hover:border-white/30 hover:text-white rounded-lg transition-all">
                            Log In
                        </a>
                        <a href="/register"
                           class="px-5 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-500 rounded-lg transition-all shadow-lg shadow-brand-600/20">
                            Get Started
                        </a>
                    </div>
                    
                    <!-- Authenticated User Profile & Logout -->
                    <div sec:authorize="isAuthenticated()" class="flex items-center gap-4">
                        <div class="flex items-center gap-2 px-3 py-1.5 hover:bg-white/5 rounded-lg transition-all">
                            <div class="w-8 h-8 bg-brand-600 rounded-full flex items-center justify-center">
                                <i class="bi bi-person-fill text-white text-sm"></i>
                            </div>
                            <span class="text-sm font-medium text-gray-200" sec:authentication="principal.name">User</span>
                        </div>
                        <a href="/logout"
                           class="px-4 py-2 text-sm font-semibold text-red-400 border border-red-400/20 hover:bg-red-400/10 rounded-lg transition-all">
                            Logout
                        </a>
                    </div>
                </div>

                <!-- Mobile Menu Button -->
                <button onclick="document.getElementById('mobile-menu').classList.toggle('hidden')"
                        class="md:hidden p-2 text-gray-400 hover:text-white">
                    <i class="bi bi-list text-xl"></i>
                </button>
            </div>

            <!-- Mobile Menu -->
            <div id="mobile-menu" class="hidden md:hidden pb-4 border-t border-white/5 mt-2 pt-4 space-y-2">
                <a href="/index" class="block px-4 py-2 text-sm text-gray-300 hover:bg-white/5 rounded-lg">Home</a>
                <a href="/index#courses" class="block px-4 py-2 text-sm text-gray-300 hover:bg-white/5 rounded-lg">Courses</a>
                
                <a sec:authorize="hasRole('STUDENT')" href="/myCourses" class="block px-4 py-2 text-sm text-gray-300 hover:bg-white/5 rounded-lg">My Courses</a>
                <a sec:authorize="hasRole('STUDENT')" href="/provideFeedback" class="block px-4 py-2 text-sm text-gray-300 hover:bg-white/5 rounded-lg">Feedback</a>

                <a sec:authorize="hasRole('ADMIN')" href="/adminProfile" class="block px-4 py-2 text-sm text-amber-400 hover:bg-white/5 rounded-lg">Admin Dashboard</a>
                <a sec:authorize="hasRole('EMPLOYEE')" href="/employeeProfile" class="block px-4 py-2 text-sm text-blue-400 hover:bg-white/5 rounded-lg">Employee Portal</a>

                <!-- Unauthenticated Mobile -->
                <div sec:authorize="!isAuthenticated()" class="pt-2 space-y-2">
                    <a href="/login" class="block px-4 py-2 text-sm text-center text-gray-300 border border-white/10 rounded-lg">Log In</a>
                    <a href="/register" class="block px-4 py-2 text-sm text-center text-white bg-brand-600 rounded-lg">Get Started</a>
                </div>
                
                <!-- Authenticated Mobile -->
                <div sec:authorize="isAuthenticated()" class="pt-2 space-y-2 border-t border-white/5">
                    <div class="block px-4 py-2 text-sm text-gray-300">
                        <i class="bi bi-person-fill mr-2"></i>
                        <span sec:authentication="principal.name">Profile</span>
                    </div>
                    <a href="/logout" class="block px-4 py-2 text-sm text-center text-red-400 border border-red-400/20 rounded-lg">Logout</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="h-16"></div>
</header>
</body>
</html>
