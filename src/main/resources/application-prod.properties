# =============================================
# EduTake — Production Profile
# =============================================
# ALL secrets MUST be supplied via environment variables.
# Do NOT commit credentials here.
# =============================================

# Server Port (honors Render dynamic $PORT)
server.port=${PORT:8080}

# JPA / Hibernate
# Defaults to 'update' on fresh deployment so tables are created automatically.
# Can be overridden to 'validate' via SPRING_JPA_HIBERNATE_DDL_AUTO if desired.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Connection Pool Tuning for Free Tier Cloud DBs (Aiven, Railway, Clever Cloud)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Logging (sanitized for production)
logging.level.in.project.main=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Thymeleaf (caching enabled for performance)
spring.thymeleaf.cache=true

# Server & Error Hardening (prevents internal stack/path leaks)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

